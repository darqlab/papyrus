<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papyrus — Ingest</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: system-ui, sans-serif; background: #f8f9fa; color: #212529; display: flex; flex-direction: row; }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    #sidebar {
      width: 220px; flex-shrink: 0; background: #1a1a2e;
      display: flex; flex-direction: column; padding: 1.5rem 0 1rem;
    }
    #sidebar .logo {
      font-size: 1.2rem; font-weight: 700; letter-spacing: .06em;
      color: #e0e0e0; padding: 0 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    #sidebar nav {
      display: flex; flex-direction: column; gap: .25rem;
      padding: 1rem .75rem; flex: 1;
    }
    #sidebar nav a {
      display: flex; align-items: center; gap: .65rem;
      color: #a0a0c0; text-decoration: none; font-size: .92rem;
      padding: .55rem .85rem; border-radius: 8px;
      transition: background .15s, color .15s;
    }
    #sidebar nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
    #sidebar nav a.active { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
    #sidebar nav a svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .85; }

    /* ── Sidebar footer (health) ─────────────────────────────────── */
    #sidebar-footer {
      padding: 1rem 1.25rem .5rem;
      border-top: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center; gap: .55rem;
    }
    .health-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #6b7280; transition: background .4s; }
    .health-dot.health-ok   { background: #22c55e; }
    .health-dot.health-warn { background: #f59e0b; }
    .health-dot.health-err  { background: #ef4444; }
    #health-label { font-size: .75rem; color: #6b7280; }

    /* ── Main ────────────────────────────────────────────────────── */
    #main { flex: 1; overflow-y: auto; min-width: 0; position: relative; }

    /* ── Sub-navigation ──────────────────────────────────────────── */
    #subnav {
      display: flex; gap: 0;
      border-bottom: 2px solid #e5e7eb;
      background: #fff;
      padding: 0 2rem;
    }
    #subnav a {
      display: flex; align-items: center; gap: .5rem;
      padding: .85rem 1.25rem;
      font-size: .9rem; font-weight: 500;
      color: #6b7280; text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color .15s, border-color .15s;
    }
    #subnav a:hover { color: #4361ee; }
    #subnav a.active { color: #4361ee; border-bottom-color: #4361ee; font-weight: 600; }
    #subnav a svg { width: 15px; height: 15px; opacity: .85; }

    /* ── Content ─────────────────────────────────────────────────── */
    main { max-width: 760px; margin: 2rem auto; padding: 0 1.5rem; display: grid; gap: 1.5rem; }

    /* ── OCR comparison — full width ─────────────────────────────── */
    #comparison-wrap {
      display: none;
      padding: 0 1.5rem 2rem;
    }
    #comparison-wrap.visible { display: block; }

    section {
      background: #fff; border-radius: 8px; padding: 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #333; }

    label { display: block; font-size: .85rem; margin-bottom: .4rem; color: #555; }
    input[type=file], select {
      width: 100%; padding: .5rem .75rem; border: 1px solid #ced4da;
      border-radius: 6px; font-size: .9rem; outline: none; transition: border-color .15s;
    }
    select:focus { border-color: #4361ee; }

    button {
      background: #4361ee; color: #fff; border: none; border-radius: 6px;
      padding: .5rem 1.2rem; font-size: .9rem; cursor: pointer; transition: background .15s;
    }
    button:hover { background: #3451d1; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
    .btn-success { background: #059669; }
    .btn-success:hover { background: #047857; }
    .btn-danger  { background: #dc2626; }
    .btn-danger:hover  { background: #b91c1c; }
    .btn-ghost  { background: #e5e7eb; color: #374151; }
    .btn-ghost:hover  { background: #d1d5db; }

    .btn-row { display: flex; gap: .6rem; align-items: center; margin-top: .75rem; flex-wrap: wrap; }
    .actions-row { display: flex; gap: .75rem; align-items: flex-end; }

    .status { font-size: .85rem; margin-top: .6rem; min-height: 1.2em; }
    .ok  { color: #2d6a4f; }
    .err { color: #c62828; }

    /* Steps */
    .steps { display: flex; gap: 0; margin-bottom: 1.25rem; }
    .step {
      flex: 1; text-align: center; font-size: .8rem; padding: .4rem;
      background: #f1f3f5; color: #9ca3af; border: 1px solid #dee2e6;
    }
    .step:first-child { border-radius: 6px 0 0 6px; }
    .step:last-child  { border-radius: 0 6px 6px 0; }
    .step.active { background: #4361ee; color: #fff; border-color: #4361ee; font-weight: 600; }
    .step.done   { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }

    /* Image preview */
    #image-preview { display: none; margin-top: .75rem; }
    #preview-img   { max-height: 150px; max-width: 100%; border-radius: 6px; border: 1px solid #ced4da; display: block; }

    /* Comparison panel */
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1rem; }
    .compare-pane { display: flex; flex-direction: column; gap: .5rem; }
    .compare-pane h3 { font-size: 1rem; font-weight: 600; color: #333; }
    .compare-pane img { width: 100%; border-radius: 6px; border: 1px solid #ced4da; object-fit: contain; max-height: 85vh; background: #f1f3f5; }
    .ocr-text {
      flex: 1; background: #f8f9fa; border: 1px solid #ced4da; border-radius: 6px;
      padding: 1rem 1.25rem; font-size: 1rem; white-space: pre-wrap;
      word-break: break-word; overflow-y: auto; max-height: 85vh;
      line-height: 1.75; min-height: 300px;
    }
    .ocr-loading { color: #6b7280; font-style: italic; }

    /* Progress bar */
    .progress-wrap { display: none; margin-top: .6rem; }
    .progress-wrap.visible { display: block; }
    .progress-track { height: 6px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-bottom: .35rem; }
    .progress-bar { height: 100%; background: #4361ee; border-radius: 99px; width: 0%; transition: width .4s ease; }
    .progress-label { font-size: .78rem; color: #6b7280; }

    /* Drag overlay */
    #drag-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(67,97,238,0.08); border: 3px dashed #4361ee;
      border-radius: 12px; z-index: 100;
      align-items: center; justify-content: center; flex-direction: column;
      gap: .75rem; pointer-events: none;
    }
    #drag-overlay.active { display: flex; }
    #drag-overlay svg { width: 48px; height: 48px; color: #4361ee; opacity: .7; }
    #drag-overlay p { font-size: 1.1rem; font-weight: 600; color: #4361ee; }

    @media (max-width: 700px) { .compare-grid { grid-template-columns: 1fr; } }
    @media (max-width: 600px) {
      #sidebar { width: 60px; }
      #sidebar .logo { font-size: 0; padding: 0 0 1rem; text-align: center; }
      #sidebar .logo::after { content: 'P'; font-size: 1.2rem; }
      #sidebar nav a span, #health-label { display: none; }
      #sidebar nav a { justify-content: center; padding: .6rem; }
      #subnav { padding: 0 1rem; }
    }
  </style>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────────────── -->
<aside id="sidebar">
  <div class="logo">Papyrus</div>
  <nav>
    <a href="/chat">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2zm2 .5v2a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 0-.5-.5h-7a.5.5 0 0 0-.5.5zm0 4a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1H4zm0 2a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1H4zm0 2a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1H4z"/></svg>
      <span>Chat</span>
    </a>
    <a href="/ingest" class="active">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/></svg>
      <span>Ingest</span>
    </a>
  </nav>
  <div id="sidebar-footer">
    <div class="health-dot" id="health-dot"></div>
    <span id="health-label">Connecting…</span>
  </div>
</aside>

<!-- ── Drag overlay ─────────────────────────────────────────────────── -->
<div id="drag-overlay">
  <svg viewBox="0 0 16 16" fill="currentColor"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/></svg>
  <p>Drop file to ingest</p>
</div>

<!-- ── Main ─────────────────────────────────────────────────────────── -->
<div id="main">

  <!-- Sub-navigation -->
  <div id="subnav">
    <a href="/ingest" class="active">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/></svg>
      Upload
    </a>
    <a href="/documents">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 10.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5zm0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5z"/><path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm0 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3z"/></svg>
      Documents
    </a>
  </div>

  <main>

    <!-- Upload -->
    <section>
      <h2>Ingest Document</h2>
      <div class="steps">
        <div class="step active" id="step1-lbl">1 · Select</div>
        <div class="step" id="step2-lbl">2 · Verify</div>
        <div class="step" id="step3-lbl">3 · Save</div>
      </div>
      <div id="step1">
        <label for="file-input">File (PDF, DOCX, TXT, HTML, MD, CSV, XLSX, PPTX, EPUB, PNG, JPG, TIFF…)</label>
        <input type="file" id="file-input"
          accept=".pdf,.docx,.txt,.html,.htm,.md,.csv,.xlsx,.pptx,.epub,.png,.jpg,.jpeg,.tiff,.tif,.bmp,.gif"
          onchange="onFileSelected(this)">
        <div id="image-preview"><img id="preview-img" alt="preview"></div>
        <div class="actions-row" style="margin-top:.75rem">
          <div style="flex:0 0 150px">
            <label for="lang-input">Language</label>
            <select id="lang-input">
              <option value="eng">English</option>
              <option value="fra">French</option>
              <option value="deu">German</option>
              <option value="spa">Spanish</option>
            </select>
          </div>
          <button id="extract-btn" onclick="extractPreview()" style="display:none">Extract &amp; Verify</button>
          <button id="direct-btn" onclick="uploadDirect()">Upload</button>
        </div>
        <div id="upload-status" class="status"></div>
        <div id="progress-wrap" class="progress-wrap">
          <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
          <div id="progress-label" class="progress-label">Processing…</div>
        </div>
      </div>
    </section>

    </section>

  </main>

  <!-- Step 2+3: OCR Comparison — full width -->
  <div id="comparison-wrap">
    <section id="comparison" style="padding:2rem">
      <h2 style="font-size:1.2rem;margin-bottom:.4rem">OCR Verification</h2>
      <p style="font-size:.9rem;color:#6b7280;margin-bottom:1rem">
        Check that the extracted text matches the image. Accept to save it, or discard to cancel.
      </p>
      <div class="compare-grid">
        <div class="compare-pane">
          <h3>Original Image</h3>
          <img id="compare-img" alt="uploaded image">
        </div>
        <div class="compare-pane">
          <h3>Extracted Text</h3>
          <div id="compare-text" class="ocr-text ocr-loading">Extracting text…</div>
        </div>
      </div>
      <div class="btn-row" style="margin-top:1.25rem">
        <button class="btn-success" id="accept-btn" onclick="acceptAndSave()" disabled>Accept &amp; Save</button>
        <button class="btn-danger btn-ghost" onclick="discardPreview()">Discard</button>
        <span id="save-status" class="status" style="margin-top:0"></span>
      </div>
    </section>
  </div>

</div>

<script>
  const api = '';
  const IMAGE_TYPES   = new Set(['image/png','image/jpeg','image/tiff','image/bmp','image/gif']);
  const ACCEPTED_EXTS = new Set([
    'pdf','docx','txt','html','htm','md','csv','xlsx','pptx','epub',
    'png','jpg','jpeg','tiff','tif','bmp','gif'
  ]);

  let currentFile     = null;
  let currentImageUrl = null;
  let currentIsImage  = false;
  let pendingText     = null;

  // ── Drag and drop ─────────────────────────────────────────────────
  const overlay = document.getElementById('drag-overlay');
  let dragCounter = 0;

  document.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; overlay.classList.add('active'); });
  document.addEventListener('dragleave', () => { dragCounter--; if (dragCounter <= 0) { dragCounter = 0; overlay.classList.remove('active'); } });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault(); dragCounter = 0; overlay.classList.remove('active');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if (!ACCEPTED_EXTS.has(ext)) {
      setStatus(document.getElementById('upload-status'), `Unsupported file type: .${ext}`, 'err');
      return;
    }
    const dt = new DataTransfer();
    dt.items.add(file);
    const input = document.getElementById('file-input');
    input.files = dt.files;
    onFileSelected(input);
  });

  // ── File selected ─────────────────────────────────────────────────
  function onFileSelected(input) {
    if (!input.files.length) return;
    currentFile    = input.files[0];
    currentIsImage = IMAGE_TYPES.has(currentFile.type);
    const preview = document.getElementById('image-preview');
    const img     = document.getElementById('preview-img');
    if (currentIsImage) {
      if (currentImageUrl) URL.revokeObjectURL(currentImageUrl);
      currentImageUrl = URL.createObjectURL(currentFile);
      img.src = currentImageUrl;
      preview.style.display = 'block';
      document.getElementById('extract-btn').style.display = '';
      document.getElementById('direct-btn').style.display  = 'none';
    } else {
      preview.style.display = 'none'; img.src = '';
      document.getElementById('extract-btn').style.display = 'none';
      document.getElementById('direct-btn').style.display  = '';
    }
    document.getElementById('comparison-wrap').classList.remove('visible');
    document.getElementById('upload-status').textContent = '';
    setStep(1);
  }

  // ── Step 2: Extract & verify ──────────────────────────────────────
  async function extractPreview() {
    const status    = document.getElementById('upload-status');
    const btn       = document.getElementById('extract-btn');
    const panel     = document.getElementById('comparison');
    const imgEl     = document.getElementById('compare-img');
    const textEl    = document.getElementById('compare-text');
    const acceptBtn = document.getElementById('accept-btn');
    if (!currentFile) { setStatus(status, 'Select a file first.', 'err'); return; }
    btn.disabled = true; setStatus(status, 'Extracting text…', '');
    pendingText = null; acceptBtn.disabled = true;
    const form = new FormData();
    form.append('file', currentFile);
    try {
      const res  = await fetch(`${api}/api/documents/preview`, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) { setStatus(status, `Error ${res.status}`, 'err'); btn.disabled = false; return; }
      pendingText = data.text;
      imgEl.src   = currentImageUrl;
      textEl.textContent = data.text && data.text.trim() ? data.text : '(No text detected)';
      textEl.className   = 'ocr-text';
      document.getElementById('comparison-wrap').classList.add('visible');
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      acceptBtn.disabled = false;
      setStatus(status, 'Text extracted. Review below, then Accept or Discard.', 'ok');
      setStep(2);
    } catch (e) {
      setStatus(status, `Network error: ${e.message}`, 'err');
    } finally { btn.disabled = false; }
  }

  // ── Step 3: Accept → ingest ───────────────────────────────────────
  async function acceptAndSave() {
    const saveStatus = document.getElementById('save-status');
    const acceptBtn  = document.getElementById('accept-btn');
    const lang       = document.getElementById('lang-input').value;
    if (!currentFile) return;
    acceptBtn.disabled = true; setStatus(saveStatus, 'Saving…', '');
    const form = new FormData();
    form.append('file', currentFile);
    form.append('language', lang);
    try {
      const res  = await fetch(`${api}/api/documents`, { method: 'POST', body: form });
      const data = await res.json();
      if (res.status === 202) {
        setStatus(saveStatus, `Processing "${data.filename}"…`, '');
        setStep(3);
        pollJob(data.jobId, saveStatus, () => { setTimeout(resetForm, 2500); }, () => { acceptBtn.disabled = false; });
      } else {
        setStatus(saveStatus, `Error ${res.status}: ${JSON.stringify(data)}`, 'err');
        acceptBtn.disabled = false;
      }
    } catch (e) {
      setStatus(saveStatus, `Network error: ${e.message}`, 'err');
      acceptBtn.disabled = false;
    }
  }

  function discardPreview() {
    document.getElementById('comparison-wrap').classList.remove('visible');
    document.getElementById('upload-status').textContent = 'Discarded.';
    pendingText = null; setStep(1);
  }

  // ── Direct upload ─────────────────────────────────────────────────
  async function uploadDirect() {
    const status = document.getElementById('upload-status');
    const btn    = document.getElementById('direct-btn');
    const lang   = document.getElementById('lang-input').value;
    if (!currentFile) { setStatus(status, 'Select a file first.', 'err'); return; }
    const form = new FormData();
    form.append('file', currentFile); form.append('language', lang);
    btn.disabled = true; setStatus(status, 'Uploading…', '');
    try {
      const res  = await fetch(`${api}/api/documents`, { method: 'POST', body: form });
      const data = await res.json();
      if (res.status === 202) {
        setStatus(status, `Processing "${data.filename}"…`, '');
        pollJob(data.jobId, status, resetForm, () => { btn.disabled = false; });
      } else {
        setStatus(status, `Error ${res.status}: ${JSON.stringify(data)}`, 'err');
        btn.disabled = false;
      }
    } catch (e) {
      setStatus(status, `Network error: ${e.message}`, 'err');
      btn.disabled = false;
    }
  }

  // ── Progress polling ──────────────────────────────────────────────
  function pollJob(jobId, statusEl, onDone, onFail) {
    const progressWrap  = document.getElementById('progress-wrap');
    const progressBar   = document.getElementById('progress-bar');
    const progressLabel = document.getElementById('progress-label');
    progressWrap.classList.add('visible');
    progressBar.style.width = '0%'; progressLabel.textContent = 'Queued…';
    const timer = setInterval(async () => {
      try {
        const res = await fetch(`${api}/api/jobs/${jobId}`);
        if (!res.ok) return;
        const job = await res.json();
        const pct = job.total > 0 ? Math.round((job.processed / job.total) * 100) : 0;
        progressBar.style.width = pct + '%';
        progressLabel.textContent = `Processing… ${pct}%`;
        if (job.status === 'DONE') {
          clearInterval(timer);
          progressBar.style.width = '100%';
          progressWrap.classList.remove('visible');
          setStatus(statusEl, 'Ingested successfully!', 'ok');
          onDone();
        } else if (job.status === 'FAILED') {
          clearInterval(timer);
          progressWrap.classList.remove('visible');
          setStatus(statusEl, 'Ingestion failed.', 'err');
          onFail();
        }
      } catch (_) {}
    }, 2000);
  }

  // ── Health indicator ──────────────────────────────────────────────
  async function checkHealth() {
    const dot   = document.getElementById('health-dot');
    const label = document.getElementById('health-label');
    try {
      const res  = await fetch('/actuator/health', { cache: 'no-store' });
      const data = await res.json();
      dot.className    = data.status === 'UP' ? 'health-dot health-ok' : 'health-dot health-warn';
      label.textContent = data.status === 'UP' ? 'Online' : 'Degraded';
    } catch {
      dot.className = 'health-dot health-err'; label.textContent = 'Offline';
    }
  }

  // ── Helpers ───────────────────────────────────────────────────────
  function resetForm() {
    document.getElementById('file-input').value = '';
    document.getElementById('image-preview').style.display = 'none';
    document.getElementById('preview-img').src = '';
    document.getElementById('comparison-wrap').classList.remove('visible');
    document.getElementById('extract-btn').style.display = 'none';
    document.getElementById('direct-btn').style.display  = '';
    document.getElementById('direct-btn').disabled        = false;
    document.getElementById('save-status').textContent    = '';
    document.getElementById('accept-btn').disabled        = true;
    document.getElementById('progress-wrap').classList.remove('visible');
    currentFile = null; currentIsImage = false; pendingText = null;
    setStep(1);
  }

  function setStep(n) {
    ['step1-lbl','step2-lbl','step3-lbl'].forEach((id, i) => {
      const el = document.getElementById(id);
      el.className = 'step' + (i + 1 < n ? ' done' : i + 1 === n ? ' active' : '');
    });
  }

  function setStatus(el, msg, cls) { el.textContent = msg; el.className = 'status ' + cls; }

  document.addEventListener('DOMContentLoaded', () => {
    checkHealth();
    setInterval(checkHealth, 60_000);
  });
</script>
</body>
</html>
