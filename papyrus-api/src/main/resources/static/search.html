<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papyrus — Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f7f8;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      background: #1a1a2e; color: #e0e0e0;
      padding: 0 2rem; display: flex; align-items: center; gap: 2rem; height: 56px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: .05em; flex-shrink: 0; }
    nav { display: flex; gap: .25rem; }
    nav a {
      color: #c0c0d0; text-decoration: none; font-size: .9rem;
      padding: .4rem .9rem; border-radius: 6px; transition: background .15s;
    }
    nav a:hover { background: rgba(255,255,255,.1); color: #fff; }
    nav a.active { background: rgba(255,255,255,.15); color: #fff; font-weight: 600; }

    /* ── Chat area ───────────────────────────────────────────────── */
    #chat-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1rem;
      scroll-behavior: smooth;
    }

    #messages {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding-bottom: 1rem;
    }

    /* ── Message bubbles ─────────────────────────────────────────── */
    .msg { display: flex; gap: .75rem; align-items: flex-start; }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 700;
    }
    .msg.assistant .avatar { background: #1a1a2e; color: #e0e0e0; }
    .msg.user .avatar      { background: #7c3aed; color: #fff; }

    .bubble {
      padding: .75rem 1.1rem;
      max-width: 82%;
      line-height: 1.65;
      font-size: .95rem;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: #ede9fe;
      color: #1e1b4b;
      border-radius: 18px 4px 18px 18px;
    }
    .msg.assistant .bubble {
      background: #fff;
      color: #111827;
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    /* Markdown styles inside assistant bubble */
    .bubble p  { margin-bottom: .6em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1,.bubble h2,.bubble h3 { margin: .8em 0 .4em; font-weight: 600; }
    .bubble ul,.bubble ol { padding-left: 1.4em; margin-bottom: .6em; }
    .bubble li { margin-bottom: .25em; }
    .bubble pre {
      background: #f3f4f6; border-radius: 8px; padding: .8rem 1rem;
      overflow-x: auto; font-size: .85rem; margin: .6em 0;
    }
    .bubble code { font-family: 'SFMono-Regular', Consolas, monospace; font-size: .88em; }
    .bubble p > code { background: #f3f4f6; padding: .1em .4em; border-radius: 4px; }
    .bubble blockquote {
      border-left: 3px solid #d1d5db; padding-left: .8rem;
      color: #6b7280; margin: .5em 0;
    }
    .bubble strong { font-weight: 600; }
    .bubble a { color: #7c3aed; text-decoration: underline; }
    .bubble table { border-collapse: collapse; width: 100%; margin: .5em 0; font-size: .9em; }
    .bubble th,.bubble td { border: 1px solid #e5e7eb; padding: .4em .7em; }
    .bubble th { background: #f9fafb; font-weight: 600; }

    /* Thinking indicator */
    .thinking { display: flex; align-items: center; gap: 4px; padding: .6rem .8rem; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #9ca3af; animation: bounce .9s infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-6px); }
    }

    /* ── Input bar ───────────────────────────────────────────────── */
    #input-wrap {
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 1rem 1rem 1.25rem;
      flex-shrink: 0;
    }
    #input-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      gap: .5rem;
      align-items: flex-end;
    }
    #msg-input {
      flex: 1;
      resize: none;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      padding: .7rem 1rem;
      font-family: inherit;
      font-size: .95rem;
      line-height: 1.5;
      max-height: 200px;
      outline: none;
      overflow-y: auto;
      transition: border-color .15s, box-shadow .15s;
    }
    #msg-input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,.12);
    }
    #send-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: none;
      background: #7c3aed;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
    }
    #send-btn:hover:not(:disabled) { background: #6d28d9; }
    #send-btn:active:not(:disabled) { transform: scale(.95); }
    #send-btn:disabled { background: #c4b5fd; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; }

    .hint {
      text-align: center; font-size: .78rem; color: #9ca3af; margin-top: .5rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Papyrus</h1>
  <nav>
    <a href="/ingest">Ingest</a>
    <a href="/search" class="active">Chat</a>
  </nav>
</header>

<div id="chat-wrap">
  <div id="messages">
    <div class="msg assistant">
      <div class="avatar">P</div>
      <div class="bubble">
        <p>Hello! I'm <strong>Papyrus</strong>, your document intelligence assistant.
        Ask me anything about your ingested committee meeting documents, resolutions, or records.
        I can help you find information, summarise content, and answer questions.</p>
      </div>
    </div>
  </div>
</div>

<div id="input-wrap">
  <div id="input-inner">
    <textarea id="msg-input" rows="1" placeholder="Message Papyrus…"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M.5 1.163A1 1 0 0 1 1.97.28l12.868 6.837a1 1 0 0 1 0 1.766L1.969 15.72A1 1 0 0 1 .5 14.836V10.33a1 1 0 0 1 .816-.983L8.5 8 1.316 6.653A1 1 0 0 1 .5 5.67V1.163z"/>
      </svg>
    </button>
  </div>
  <p class="hint">Press <kbd style="font-family:monospace;background:#f3f4f6;padding:.1em .4em;border-radius:4px;font-size:.9em">Enter</kbd> to send &nbsp;·&nbsp; <kbd style="font-family:monospace;background:#f3f4f6;padding:.1em .4em;border-radius:4px;font-size:.9em">Shift+Enter</kbd> for a new line</p>
</div>

<script>
  marked.use({ breaks: true, gfm: true });

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('msg-input');
  const sendBtn    = document.getElementById('send-btn');
  const chatWrap   = document.getElementById('chat-wrap');

  const history = [];   // [{role, content}]
  let streaming = false;

  // ── Auto-resize textarea ─────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
  });

  // ── Enter to send ────────────────────────────────────────────────
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!streaming) sendMessage();
    }
  });

  // ── Scroll to bottom ─────────────────────────────────────────────
  function scrollBottom() {
    chatWrap.scrollTop = chatWrap.scrollHeight;
  }

  // ── Append a user bubble ─────────────────────────────────────────
  function appendUser(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `
      <div class="avatar">U</div>
      <div class="bubble">${esc(text)}</div>`;
    messagesEl.appendChild(div);
    scrollBottom();
  }

  // ── Append a (streaming) assistant bubble ────────────────────────
  function appendAssistant() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `
      <div class="avatar">P</div>
      <div class="bubble">
        <div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>`;
    messagesEl.appendChild(div);
    scrollBottom();
    return div.querySelector('.bubble');
  }

  // ── Stream /api/chat using fetch + SSE ───────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || streaming) return;

    streaming = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendUser(text);
    history.push({ role: 'user', content: text });

    const bubble = appendAssistant();
    let accumulated = '';

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      if (!res.ok) {
        bubble.innerHTML = `<span style="color:#dc2626">Error ${res.status}</span>`;
        history.pop();
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer    = '';
      let done_flag = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        // Split on double-newline (SSE event boundary)
        const parts = buffer.split('\n\n');
        buffer = parts.pop(); // keep incomplete tail

        for (const part of parts) {
          const lines = part.split('\n');
          let evtName = '';
          const dataLines = [];

          for (const line of lines) {
            if (line.startsWith('event:')) evtName = line.slice(6).trim();
            else if (line.startsWith('data:')) dataLines.push(line.slice(5));
          }

          const rawData = dataLines.join('\n');

          if (evtName === 'done') {
            done_flag = true;
          } else if (evtName === 'error') {
            bubble.innerHTML = `<span style="color:#dc2626">Error: ${esc(JSON.parse(rawData))}</span>`;
            history.pop();
            return;
          } else if (rawData) {
            try {
              const chunk = JSON.parse(rawData);
              accumulated += chunk;
              // Render markdown live
              bubble.innerHTML = marked.parse(accumulated);
              scrollBottom();
            } catch (_) {}
          }
        }
        if (done_flag) break;
      }

      // Final render
      bubble.innerHTML = marked.parse(accumulated);
      scrollBottom();
      history.push({ role: 'assistant', content: accumulated });

    } catch (err) {
      bubble.innerHTML = `<span style="color:#dc2626">Network error: ${esc(err.message)}</span>`;
      history.pop();
    } finally {
      streaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Focus on load
  window.addEventListener('DOMContentLoaded', () => inputEl.focus());
</script>
</body>
</html>
