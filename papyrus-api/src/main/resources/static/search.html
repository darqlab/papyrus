<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papyrus — Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8f9fa; color: #212529; }

    header {
      background: #1a1a2e; color: #e0e0e0;
      padding: 0 2rem; display: flex; align-items: center; gap: 2rem; height: 56px;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: .05em; flex-shrink: 0; }
    nav { display: flex; gap: .25rem; }
    nav a {
      color: #c0c0d0; text-decoration: none; font-size: .9rem;
      padding: .4rem .9rem; border-radius: 6px; transition: background .15s;
    }
    nav a:hover { background: rgba(255,255,255,.1); color: #fff; }
    nav a.active { background: rgba(255,255,255,.15); color: #fff; font-weight: 600; }

    main { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; display: grid; gap: 1.5rem; }

    section {
      background: #fff; border-radius: 8px; padding: 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #333; }

    label { display: block; font-size: .85rem; margin-bottom: .4rem; color: #555; }
    input[type=text], select {
      width: 100%; padding: .5rem .75rem; border: 1px solid #ced4da;
      border-radius: 6px; font-size: .9rem; outline: none; transition: border-color .15s;
    }
    input:focus, select:focus { border-color: #4361ee; }

    button {
      background: #4361ee; color: #fff; border: none; border-radius: 6px;
      padding: .5rem 1.2rem; font-size: .9rem; cursor: pointer; transition: background .15s;
    }
    button:hover { background: #3451d1; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
    .btn-sm { font-size: .8rem; padding: .25rem .7rem; }

    .search-row { display: flex; gap: .75rem; align-items: flex-end; }
    .search-row > *:first-child { flex: 1; }

    .filters { display: flex; gap: .75rem; margin-top: .75rem; align-items: flex-end; }
    .filters > * { flex: 1; }
    .filters > button { flex: 0 0 auto; }

    .status { font-size: .85rem; margin-top: .6rem; min-height: 1.2em; }
    .ok  { color: #2d6a4f; }
    .err { color: #c62828; }

    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    th { text-align: left; padding: .5rem .75rem; background: #f1f3f5; font-weight: 600; border-bottom: 2px solid #dee2e6; }
    td { padding: .5rem .75rem; border-bottom: 1px solid #f1f3f5; vertical-align: top; }
    tr:last-child td { border-bottom: none; }

    .score-bar-wrap { display: flex; align-items: center; gap: .5rem; }
    .score-bar { height: 6px; border-radius: 3px; background: #4361ee; min-width: 4px; }
    .score-label { font-size: .8rem; color: #6b7280; white-space: nowrap; }
    .chunk { white-space: pre-wrap; word-break: break-word; max-height: 140px; overflow-y: auto; line-height: 1.5; }
    .source-cell { font-size: .85rem; white-space: nowrap; }
    .source-cell small { color: #9ca3af; display: block; }
    .empty { color: #9ca3af; font-size: .875rem; padding: .5rem 0; }

    .badge { display: inline-block; padding: .2em .55em; border-radius: 4px; font-size: .75rem; font-weight: 600; }
    .badge-done   { background: #d1fae5; color: #065f46; }
    .badge-failed { background: #fee2e2; color: #991b1b; }
    .badge-other  { background: #e0e7ff; color: #3730a3; }
  </style>
</head>
<body>

<header>
  <h1>Papyrus</h1>
  <nav>
    <a href="/ingest">Ingest</a>
    <a href="/search" class="active">Search</a>
  </nav>
</header>

<main>

  <section>
    <h2>Semantic Search</h2>

    <div class="search-row">
      <div>
        <label for="query-input">Query</label>
        <input type="text" id="query-input" placeholder="What does the document say about…" autofocus>
      </div>
      <button id="search-btn" onclick="doSearch()">Search</button>
    </div>

    <div class="filters">
      <div>
        <label for="source-filter">Filter by document</label>
        <select id="source-filter">
          <option value="">All documents</option>
        </select>
      </div>
      <div style="flex:0 0 90px">
        <label for="topk-input">Top K</label>
        <input type="text" id="topk-input" value="5">
      </div>
    </div>

    <div id="search-status" class="status"></div>
    <div id="results-table" style="margin-top:1rem"></div>
  </section>

</main>

<script>
  const api = '';

  async function doSearch() {
    const query    = document.getElementById('query-input').value.trim();
    const topK     = parseInt(document.getElementById('topk-input').value) || 5;
    const sourceId = document.getElementById('source-filter').value || null;
    const status   = document.getElementById('search-status');
    const table    = document.getElementById('results-table');
    const btn      = document.getElementById('search-btn');

    if (!query) { setStatus(status, 'Enter a search query.', 'err'); return; }

    btn.disabled = true;
    setStatus(status, 'Searching…', '');
    table.innerHTML = '';

    try {
      const res  = await fetch(`${api}/api/search`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, topK, sourceId })
      });
      const data = await res.json();
      if (res.ok) {
        setStatus(status, `${data.length} result(s) for "${query}"`, 'ok');
        table.innerHTML = data.length ? renderResults(data) : '<p class="empty">No results found.</p>';
      } else {
        setStatus(status, `Error ${res.status}`, 'err');
      }
    } catch (e) {
      setStatus(status, `Network error: ${e.message}`, 'err');
    } finally {
      btn.disabled = false;
    }
  }

  function renderResults(data) {
    return `<table>
      <thead><tr><th>#</th><th>Score</th><th>Document</th><th>Extracted Content</th></tr></thead>
      <tbody>
        ${data.map((r, i) => `<tr>
          <td style="width:2rem;color:#9ca3af">${i + 1}</td>
          <td style="width:100px">
            <div class="score-bar-wrap">
              <div class="score-bar" style="width:${Math.round(r.score * 70)}px"></div>
              <span class="score-label">${(r.score * 100).toFixed(1)}%</span>
            </div>
          </td>
          <td class="source-cell">
            ${esc(r.sourceFilename)}
            <small>chunk ${r.chunkIndex}</small>
          </td>
          <td><div class="chunk">${esc(r.content)}</div></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  }

  async function loadSourceFilter() {
    try {
      const res  = await fetch(`${api}/api/documents?limit=200`);
      const data = await res.json();
      const sel  = document.getElementById('source-filter');
      data.filter(d => d.status === 'DONE').forEach(d => {
        const opt = document.createElement('option');
        opt.value       = d.id;
        opt.textContent = d.filename;
        sel.appendChild(opt);
      });
    } catch (_) {}
  }

  function setStatus(el, msg, cls) { el.textContent = msg; el.className = 'status ' + cls; }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadSourceFilter();
    document.getElementById('query-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
  });
</script>
</body>
</html>
