<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papyrus — Manage</title>
  <script>
    (function() {
      const theme = localStorage.getItem('papyrus-theme') || 'dark';
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #1a1a1a;
      --text-muted: #6b7280;
      --text-faint: #9ca3af;
      --code-bg: #f3f4f6;
      --table-head: #f9fafb;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg: #0f0f13;
      --surface: #1c1c24;
      --border: #2e2e3a;
      --text: #e8e8f0;
      --text-muted: #8888a8;
      --text-faint: #55556a;
      --code-bg: #1a1a24;
      --table-head: #1a1a24;
      --input-bg: #1c1c24;
    }

    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: row;
    }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    #sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 0 1rem;
    }
    #sidebar .logo {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: #e0e0e0;
      padding: 0 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    #sidebar nav {
      display: flex;
      flex-direction: column;
      gap: .25rem;
      padding: 1rem .75rem 0;
    }
    #sidebar nav a {
      display: flex;
      align-items: center;
      gap: .65rem;
      color: #a0a0c0;
      text-decoration: none;
      font-size: .92rem;
      padding: .55rem .85rem;
      border-radius: 8px;
      transition: background .15s, color .15s;
    }
    #sidebar nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
    #sidebar nav a.active { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
    #sidebar nav a svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .85; }
    #sidebar-footer {
      margin-top: auto;
      padding: 1rem 1.25rem .5rem;
      border-top: 1px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      gap: .55rem;
    }
    .health-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: #6b7280; transition: background .4s;
    }
    .health-dot.health-ok  { background: #22c55e; }
    .health-dot.health-err { background: #ef4444; }
    #health-label { font-size: .75rem; color: #6b7280; }

    /* ── Main ───────────────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    #header {
      padding: 1.25rem 2rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    #header h1 { font-size: 1.1rem; font-weight: 700; flex: 1; color: var(--text); }

    #header-actions {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .btn {
      padding: .45rem 1rem;
      border-radius: 8px;
      font-size: .88rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background .15s, opacity .15s;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #4338ca; }
    .btn-danger  { background: #dc2626; color: #fff; }
    .btn-danger:hover:not(:disabled)  { background: #b91c1c; }
    .btn-ghost   { background: #f3f4f6; color: #374151; }
    .btn-ghost:hover:not(:disabled)   { background: #e5e7eb; }

    /* ── Filter bar ───────────────────────────────────────────────── */
    #filter-bar {
      padding: .75rem 2rem;
      background: var(--table-head);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: .75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    #filter-bar label { font-size: .85rem; color: var(--text-muted); }
    #filter-bar select, #filter-bar input {
      padding: .35rem .75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: .88rem;
      background: var(--input-bg);
      color: var(--text);
    }
    #doc-count { font-size: .82rem; color: var(--text-faint); margin-left: auto; }

    /* ── Table ───────────────────────────────────────────────────── */
    #table-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    thead th {
      text-align: left;
      padding: .6rem .75rem;
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
      background: var(--table-head);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: var(--code-bg); }
    td { padding: .65rem .75rem; vertical-align: middle; color: var(--text); }

    .col-check { width: 36px; text-align: center; }
    .col-file  { min-width: 180px; }
    .col-archive { min-width: 200px; }
    .col-type  { width: 90px; }
    .col-date  { width: 130px; }
    .col-status { width: 90px; }
    .col-action { width: 120px; text-align: right; }

    .badge {
      display: inline-block;
      padding: .18rem .55rem;
      border-radius: 99px;
      font-size: .75rem;
      font-weight: 600;
    }
    .badge-done    { background: #dcfce7; color: #16a34a; }
    .badge-failed  { background: #fee2e2; color: #dc2626; }
    .badge-processing { background: #fef9c3; color: #ca8a04; }
    .badge-reingested { background: #e0e7ff; color: #4338ca; }

    .archive-name {
      font-family: monospace;
      font-size: .82rem;
      color: var(--text-muted);
    }
    .archive-name a { color: #4f46e5; text-decoration: none; }
    .archive-name a:hover { text-decoration: underline; }

    .file-name { font-weight: 500; color: var(--text); }
    .file-type { font-size: .78rem; color: var(--text-faint); text-transform: uppercase; font-weight: 600; }

    /* ── Job toast ───────────────────────────────────────────────── */
    #toast-area {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      z-index: 100;
    }
    .toast {
      background: var(--surface);
      color: var(--text);
      padding: .65rem 1rem;
      border-radius: 10px;
      font-size: .85rem;
      min-width: 260px;
      display: flex;
      align-items: center;
      gap: .65rem;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
      animation: slideIn .2s ease;
      border: 1px solid var(--border);
    }
    .toast.toast-ok  { border-left: 4px solid #22c55e; }
    .toast.toast-err { border-left: 4px solid #ef4444; }
    .toast.toast-run { border-left: 4px solid #f59e0b; }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 720px) {
      #sidebar { width: 56px; }
      #sidebar nav a span, #health-label { display: none; }
      #sidebar nav a { justify-content: center; padding: .6rem; }
      #table-wrap { padding: 1rem; }
      #header, #filter-bar { padding-left: 1rem; padding-right: 1rem; }
    }
  </style>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────────────── -->
<div id="sidebar">
  <div class="logo">📜 Papyrus</div>
  <nav>
    <a href="/chat">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2zm2 .5v2a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 0-.5-.5h-7a.5.5 0 0 0-.5.5zm0 4a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1H4zm0 2a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1H4zm0 2a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1H4z"/></svg>
      <span>Chat</span>
    </a>
    <a href="/ingest" data-role="contributor">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/></svg>
      <span>Ingest</span>
    </a>
    <a href="/documents">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 10.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5zm0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5z"/><path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm0 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3z"/></svg>
      <span>Documents</span>
    </a>
    <a href="/manage" class="active" data-role="admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Manage</span>
    </a>
    <a href="/admin/users" data-role="admin">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7Zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-5.784 6A2.238 2.238 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.325 6.325 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1h4.216ZM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/></svg>
      <span>Users</span>
    </a>
  </nav>
  <div id="sidebar-footer">
    <button id="theme-toggle" style="background: none; border: none; color: #a0a0c0; font-size: 1.1rem; cursor: pointer; padding: 0.4rem; margin-right: auto;" title="Toggle dark mode">
      <span id="theme-icon">☀️</span>
    </button>
    <div class="health-dot" id="health-dot"></div>
    <span id="health-label">checking…</span>
  </div>
</div>

<!-- ── Main ───────────────────────────────────────────────────────── -->
<div id="main">

  <div id="header">
    <h1>Archive Manager</h1>
    <div id="header-actions">
      <span id="sel-count" style="font-size:.85rem;color:#6b7280;display:none"></span>
      <button class="btn btn-primary" id="reingest-sel-btn" disabled onclick="reingestSelected()">Re-ingest selected</button>
      <button class="btn btn-ghost" onclick="loadDocuments()">Refresh</button>
    </div>
  </div>

  <div id="filter-bar">
    <label for="filter-status">Status</label>
    <select id="filter-status" onchange="applyFilter()">
      <option value="">All</option>
      <option value="DONE">Done</option>
      <option value="FAILED">Failed</option>
      <option value="PROCESSING">Processing</option>
    </select>
    <label for="filter-type">Type</label>
    <select id="filter-type" onchange="applyFilter()">
      <option value="">All types</option>
      <option value="image">Image (OCR)</option>
      <option value="pdf">PDF</option>
      <option value="docx">DOCX</option>
      <option value="pptx">PPTX</option>
      <option value="other">Other</option>
    </select>
    <label for="filter-search">Search</label>
    <input id="filter-search" type="text" placeholder="filename…" oninput="applyFilter()">
    <span id="doc-count"></span>
  </div>

  <div id="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-check"><input type="checkbox" id="chk-all" onchange="toggleAll(this)"></th>
          <th class="col-file">Original file</th>
          <th class="col-archive">Archive name</th>
          <th class="col-type">Type</th>
          <th class="col-date">Ingested</th>
          <th class="col-status">Status</th>
          <th class="col-action">Action</th>
        </tr>
      </thead>
      <tbody id="doc-tbody">
        <tr><td colspan="7" style="text-align:center;padding:2rem;color:#9ca3af">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── Toast area ─────────────────────────────────────────────────── -->
<div id="toast-area"></div>

<script>
  let allDocs = [];
  let filtered = [];
  const IMAGE_TYPES = ['image/png','image/jpeg','image/jpg','image/tiff','image/bmp','image/gif'];

  // ── Theme toggle ─────────────────────────────────────────────────
  function updateThemeIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const icon = document.getElementById('theme-icon');
    if (icon) icon.textContent = isDark ? '☀️' : '🌙';
  }

  const themeToggle = document.getElementById('theme-toggle');
  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('papyrus-theme', isDark ? 'light' : 'dark');
      updateThemeIcon();
    });
  }

  // ── Utilities ────────────────────────────────────────────────────
  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fileTypeLabel(contentType, filename) {
    if (!contentType) return 'unknown';
    if (IMAGE_TYPES.includes(contentType)) return 'Image';
    if (contentType === 'application/pdf') return 'PDF';
    if (contentType.includes('wordprocessing')) return 'DOCX';
    if (contentType.includes('presentation')) return 'PPTX';
    if (contentType.includes('spreadsheet')) return 'XLSX';
    if (contentType === 'text/plain') return 'TXT';
    const ext = (filename || '').split('.').pop().toUpperCase();
    return ext || 'File';
  }

  function fileTypeCategory(contentType) {
    if (IMAGE_TYPES.includes(contentType)) return 'image';
    if (contentType === 'application/pdf') return 'pdf';
    if (contentType && contentType.includes('wordprocessing')) return 'docx';
    if (contentType && contentType.includes('presentation')) return 'pptx';
    return 'other';
  }

  function formatDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
  }

  function formatArchiveLabel(name) {
    if (!name) return '—';
    const m = name.match(/^(\d{4}-\d{2}-\d{2})-(.+?)(-p\d+)?$/);
    if (!m) return name;
    const slug = m[2].replace(/-/g,' ');
    const page = m[3] ? ' ' + m[3].replace('-p','p.') : '';
    const date = new Date(m[1]+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
    return `${slug}${page} — ${date}`;
  }

  // ── Load documents ───────────────────────────────────────────────
  async function loadDocuments() {
    const tbody = document.getElementById('doc-tbody');
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:#9ca3af">Loading…</td></tr>';
    try {
      const res = await fetch('/api/documents?limit=500');
      allDocs = await res.json();
      applyFilter();
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:2rem;color:#dc2626">Failed to load: ${esc(e.message)}</td></tr>`;
    }
  }

  // ── Filter ───────────────────────────────────────────────────────
  function applyFilter() {
    const status = document.getElementById('filter-status').value;
    const type   = document.getElementById('filter-type').value;
    const search = document.getElementById('filter-search').value.toLowerCase();

    filtered = allDocs.filter(d => {
      if (status && d.status !== status) return false;
      if (type   && fileTypeCategory(d.contentType) !== type) return false;
      if (search) {
        const hay = (d.filename + ' ' + (d.archiveFilename || '')).toLowerCase();
        if (!hay.includes(search)) return false;
      }
      return true;
    });

    document.getElementById('doc-count').textContent =
      `${filtered.length} of ${allDocs.length} document${allDocs.length !== 1 ? 's' : ''}`;
    renderTable();
  }

  // ── Render table ─────────────────────────────────────────────────
  function renderTable() {
    const tbody = document.getElementById('doc-tbody');
    document.getElementById('chk-all').checked = false;
    updateSelCount();

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:#9ca3af">No documents match the filter.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(d => {
      const hasArchive = !!d.archiveFilename;
      const isReingested = !!d.archiveSourceId;
      const fileUrl = hasArchive ? `/api/documents/${d.id}/file` : null;
      const archiveLabel = hasArchive ? formatArchiveLabel(d.archiveFilename) : '—';
      const archiveCell = hasArchive
        ? `<a href="${fileUrl}" target="_blank" rel="noopener" class="archive-name" title="${esc(d.archiveFilename)}">${esc(archiveLabel)}</a>`
        : `<span style="color:#9ca3af;font-size:.82rem">not archived</span>`;

      const statusBadge = {
        DONE: 'badge-done', FAILED: 'badge-failed', PROCESSING: 'badge-processing'
      }[d.status] || 'badge-ghost';

      const canReingest = hasArchive;

      return `<tr data-id="${d.id}">
        <td class="col-check"><input type="checkbox" class="row-chk" data-id="${d.id}" ${canReingest ? '' : 'disabled'} onchange="updateSelCount()"></td>
        <td class="col-file">
          <div class="file-name">${esc(d.filename)}</div>
          ${isReingested ? '<div style="font-size:.75rem;color:#6366f1;margin-top:.2rem">re-ingested</div>' : ''}
        </td>
        <td class="col-archive">${archiveCell}</td>
        <td class="col-type"><span class="file-type">${esc(fileTypeLabel(d.contentType, d.filename))}</span></td>
        <td class="col-date">${formatDate(d.createdAt)}</td>
        <td class="col-status">
          <span class="badge ${statusBadge}">${esc(d.status)}</span>
          ${d.chunkingStrategy ? `<div style="margin-top:.3rem;font-size:.72rem;color:#6366f1;font-weight:500" title="Stored chunking config — re-ingest will use this automatically">${esc(d.chunkingStrategy)}${d.chunkingMaxTokens ? ' · ' + d.chunkingMaxTokens + 't' : ''}</div>` : ''}
        </td>
        <td class="col-action" style="text-align:right">
          ${canReingest
            ? `<div style="display:flex;flex-direction:column;gap:.25rem;align-items:flex-end">
                <button class="btn btn-ghost" style="font-size:.78rem;padding:.25rem .6rem" onclick="reingestOne('${d.id}', '${esc(d.filename)}')">Re-ingest (text)</button>
                <button class="btn btn-ghost" style="font-size:.78rem;padding:.25rem .6rem;color:#d97706" onclick="reingestOneFromFile('${d.id}', '${esc(d.filename)}')">Re-ingest (file)</button>
              </div>`
            : `<span style="font-size:.78rem;color:#d1d5db">—</span>`}
        </td>
      </tr>`;
    }).join('');
  }

  // ── Selection ─────────────────────────────────────────────────────
  function toggleAll(chk) {
    document.querySelectorAll('.row-chk:not(:disabled)').forEach(c => c.checked = chk.checked);
    updateSelCount();
  }

  function updateSelCount() {
    const selected = [...document.querySelectorAll('.row-chk:checked')];
    const btn = document.getElementById('reingest-sel-btn');
    const label = document.getElementById('sel-count');
    btn.disabled = selected.length === 0;
    if (selected.length > 0) {
      label.style.display = '';
      label.textContent = `${selected.length} selected`;
    } else {
      label.style.display = 'none';
    }
  }

  // ── Re-ingest one (from cached text — fast) ──────────────────────
  async function reingestOne(sourceId, filename) {
    try {
      const res = await fetch(`/api/documents/${sourceId}/reingest`, { method: 'POST' });
      if (!res.ok) { showToast(`Re-ingest failed (${res.status})`, 'err'); return; }
      const job = await res.json();
      showToast(`Re-ingesting ${filename}…`, 'run');
      pollJob(job.jobId, filename);
    } catch (e) {
      showToast(`Error: ${e.message}`, 'err');
    }
  }

  // ── Re-ingest one (from original file — slow, re-runs extraction) ─
  async function reingestOneFromFile(sourceId, filename) {
    const ok = confirm(
      `Re-ingest from original file: "${filename}"\n\n` +
      `This re-runs the full extractor on the original archived file.\n` +
      `For large documents (100+ pages) this may take several minutes.\n\n` +
      `Use this when extraction logic has changed (e.g. strikeout detection).\n\n` +
      `Continue?`
    );
    if (!ok) return;
    try {
      const res = await fetch(`/api/documents/${sourceId}/reingest-file`, { method: 'POST' });
      if (!res.ok) { showToast(`Re-ingest failed (${res.status})`, 'err'); return; }
      const job = await res.json();
      showToast(`Re-extracting ${filename} — this may take a while…`, 'run');
      pollJob(job.jobId, filename);
    } catch (e) {
      showToast(`Error: ${e.message}`, 'err');
    }
  }

  // ── Re-ingest selected ────────────────────────────────────────────
  async function reingestSelected() {
    const ids = [...document.querySelectorAll('.row-chk:checked')].map(c => c.dataset.id);
    for (const id of ids) {
      const doc = allDocs.find(d => d.id === id);
      await reingestOne(id, doc?.filename || id);
      await new Promise(r => setTimeout(r, 150)); // stagger slightly
    }
    // Uncheck all
    document.querySelectorAll('.row-chk').forEach(c => c.checked = false);
    document.getElementById('chk-all').checked = false;
    updateSelCount();
  }

  // ── Job polling ──────────────────────────────────────────────────
  async function pollJob(jobId, filename) {
    let attempts = 0;
    while (attempts++ < 120) {
      await new Promise(r => setTimeout(r, 2000));
      try {
        const res = await fetch(`/api/jobs/${jobId}`);
        if (!res.ok) continue;
        const job = await res.json();
        if (job.status === 'DONE') {
          showToast(`Re-ingested: ${filename}`, 'ok');
          await loadDocuments();
          return;
        }
        if (job.status === 'FAILED') {
          showToast(`Re-ingest failed: ${filename}`, 'err');
          await loadDocuments();
          return;
        }
      } catch (_) {}
    }
    showToast(`Re-ingest timed out: ${filename}`, 'err');
  }

  // ── Toast ────────────────────────────────────────────────────────
  function showToast(msg, type = 'run') {
    const area = document.getElementById('toast-area');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    area.appendChild(el);
    setTimeout(() => el.remove(), type === 'run' ? 8000 : 4000);
  }

  // ── Health ───────────────────────────────────────────────────────
  async function checkHealth() {
    const dot = document.getElementById('health-dot');
    const lbl = document.getElementById('health-label');
    try {
      const r = await fetch('/actuator/health');
      const j = await r.json();
      const ok = j.status === 'UP';
      dot.className = 'health-dot ' + (ok ? 'health-ok' : 'health-err');
      lbl.textContent = ok ? 'Online' : 'Degraded';
    } catch {
      dot.className = 'health-dot health-err';
      lbl.textContent = 'Offline';
    }
  }

  // ── Init ─────────────────────────────────────────────────────────
  checkHealth();
  loadDocuments();
  updateThemeIcon();
  (async function applyNavRoles() {
    try {
      const r = await fetch('/api/me');
      if (!r.ok) return;
      const me = await r.json();
      const roles = me.roles || [];
      const isAdmin   = roles.includes('ADMIN');
      const canIngest = isAdmin || roles.includes('CONTRIBUTOR');
      if (!canIngest) document.querySelectorAll('[data-role="contributor"]').forEach(el => el.style.display = 'none');
      if (!isAdmin)   document.querySelectorAll('[data-role="admin"]').forEach(el => el.style.display = 'none');
    } catch(e) {}
  })();
</script>
</body>
</html>
