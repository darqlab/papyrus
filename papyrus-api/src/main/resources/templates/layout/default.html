<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title layout:title-pattern="$CONTENT_TITLE — Papyrus">Papyrus</title>
  <script>
    (function() {
      // Paper (light) is the designed-first default per design-brief.md v1.1 §1.
      const theme = localStorage.getItem('papyrus-theme') || 'light';
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <link rel="stylesheet" th:href="@{/tokens.css}">
  <link rel="stylesheet" th:href="@{/sidebar.css}">
  <th:block layout:fragment="head"></th:block>
</head>
<body>

<aside id="sidebar">
  <div class="logo">Papyrus</div>
  <th:block th:replace="~{fragments/sidebar :: sidebar-nav}"></th:block>
  <th:block layout:fragment="sidebar-extra"><!-- page-specific sidebar additions --></th:block>
  <div id="sidebar-footer">
    <button id="theme-toggle" title="Switch theme" aria-label="Switch theme">
      <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="health-dot" id="health-dot"></div>
    <span id="health-label">Connecting…</span>
  </div>
</aside>

<div id="main">
  <th:block layout:fragment="content"></th:block>
</div>

<script th:src="@{/sidebar.js}"></script>
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
