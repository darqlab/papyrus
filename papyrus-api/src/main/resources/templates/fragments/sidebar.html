<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/springsecurity">
<body>
<!-- Nav shrinks to Chat / Ingest / Documents / Users per ADR-008 (Manage merged into Documents).
     Icons: Lucide-style line icons, 1.5px stroke (design-brief.md §7) — consistent set replacing
     the previous mixed solid/line icons. -->
<nav th:fragment="sidebar-nav">
  <a href="/chat"
     th:classappend="${activePage == 'chat'} ? ' active'">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Chat</span>
  </a>
  <a href="/ingest"
     sec:authorize="hasAnyRole('CONTRIBUTOR','ADMIN')"
     th:classappend="${activePage == 'ingest'} ? ' active'">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    <span>Ingest</span>
  </a>
  <a href="/documents"
     th:classappend="${activePage == 'documents'} ? ' active'">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
    <span>Documents</span>
  </a>
  <a href="/admin/users"
     sec:authorize="hasRole('ADMIN')"
     th:classappend="${activePage == 'admin'} ? ' active'">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>Users</span>
  </a>
</nav>
</body>
</html>
