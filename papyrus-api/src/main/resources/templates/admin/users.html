<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/default}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Papyrus — Users</title>
  <style layout:fragment="head">
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    main { flex: 1; overflow-y: auto; padding: 2rem; max-width: 1280px; margin: 0 auto; width: 100%; }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; }
    .page-header h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.6875rem; }

    /* ── Invite form ─────────────────────────────────────────────── */
    #invite-panel, #mcp-panel { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
    #invite-panel.open, #mcp-panel.open { display: block; }
    #invite-panel h3, #mcp-panel h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
    .invite-row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end; }
    .invite-row label { display: flex; flex-direction: column; gap: .3rem; font-size: .82rem; color: var(--text-muted); }
    .invite-row input, .invite-row select {
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: .45rem .7rem; font-size: .9rem; color: var(--text); outline: none;
      min-width: 160px;
    }
    .invite-row input:focus, .invite-row select:focus { border-color: var(--accent); }
    .invite-actions { display: flex; gap: .5rem; margin-top: .5rem; }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .btn { padding: .5rem 1.1rem; border-radius: 7px; border: none; font-size: .88rem; font-weight: 600; cursor: pointer; transition: opacity .15s, background .15s, color .15s, border-color .15s; min-height: 44px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost { background: none; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--text-faint); }
    .btn-danger { color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); background: none; }
    .btn-danger:hover:not(:disabled) { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-sm { padding: .35rem .8rem; font-size: .82rem; min-height: 36px; }

    /* ── Role badges — status marked by text, not color alone ───────── */
    .badge { display: inline-block; padding: .18rem .55rem; border-radius: 5px; font-size: .76rem; font-weight: 600; letter-spacing: .02em; }
    .badge-admin       { color: var(--danger); }
    .badge-contributor { color: var(--accent); }
    .badge-reader      { color: var(--text-muted); }

    .role-select { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: .3rem .5rem; font-size: .85rem; color: var(--text); cursor: pointer; min-height: 36px; }

    .action-cell { display: flex; gap: .4rem; align-items: center; }

    /* ── Error banner ────────────────────────────────────────────── */
    #error-banner { display: none; background: color-mix(in srgb, var(--danger) 10%, var(--surface)); color: var(--danger); border-radius: 6px; padding: .7rem 1rem; margin-bottom: 1rem; font-size: .9rem; border: 1px solid var(--danger); }

    /* ── Confirm modal ───────────────────────────────────────────── */
    #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center; }
    #modal-overlay.open { display: flex; }
    #modal { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; max-width: 400px; width: 90%; }
    #modal h3 { font-size: 1rem; font-weight: 600; margin-bottom: .6rem; }
    #modal p { font-size: .9rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.5; }
    #modal-actions { display: flex; gap: .5rem; justify-content: flex-end; }

    /* ── Section spacing ────────────────────────────────────────── */
    .section-header { margin-top: 2.5rem; }

    /* ── Token reveal modal ─────────────────────────────────────── */
    #token-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 1.5rem; max-width: 480px; width: 90%; }
    #token-modal h3 { font-size: 1rem; font-weight: 600; margin-bottom: .6rem; }
    #token-modal p { font-size: .85rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.5; }
    #token-box { display: flex; gap: .5rem; align-items: center; background: var(--table-head); border: 1px solid var(--border); border-radius: 7px; padding: .6rem .8rem; margin-bottom: 1.25rem; }
    #token-value { flex: 1; font-family: ui-monospace, monospace; font-size: .82rem; word-break: break-all; color: var(--text); }
    #token-warning { font-size: .82rem; color: var(--danger); margin-bottom: 1rem; }

  </style>
</head>
<body>

<th:block layout:fragment="content">
<main>

  <div class="page-header">
    <h1>Users</h1>
    <button class="btn btn-primary" onclick="toggleInvite()">+ Invite user</button>
  </div>

  <!-- Invite panel -->
  <div id="invite-panel">
    <h3>Invite a new user</h3>
    <div class="invite-row">
      <label>First name <input id="inv-first" type="text" placeholder="Jane"></label>
      <label>Last name  <input id="inv-last"  type="text" placeholder="Doe"></label>
      <label>Email      <input id="inv-email" type="email" placeholder="jane@example.com"></label>
      <label>Role
        <select id="inv-role">
          <option value="READER">Reader</option>
          <option value="CONTRIBUTOR">Contributor</option>
          <option value="ADMIN">Admin</option>
        </select>
      </label>
    </div>
    <div class="invite-actions">
      <button class="btn btn-primary btn-sm" id="inv-submit" onclick="submitInvite()">Send invite</button>
      <button class="btn btn-ghost btn-sm" onclick="toggleInvite()">Cancel</button>
    </div>
  </div>

  <div id="error-banner"></div>

  <!-- Users table — shared table component (design-brief.md §4) -->
  <div class="pp-card">
    <table class="pp-table" id="users-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Created</th>
          <th>Last login</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="users-tbody">
        <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-faint)">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="page-header section-header">
    <h1>MCP Clients</h1>
    <button class="btn btn-primary" onclick="toggleMcpPanel()">+ Generate Token</button>
  </div>

  <!-- Generate MCP token panel -->
  <div id="mcp-panel">
    <h3>Generate MCP Client Token</h3>
    <div class="invite-row">
      <label>Name <input id="mcp-name" type="text" placeholder="claude-code-darqlab"></label>
      <label>Role
        <select id="mcp-role">
          <option value="READER">Reader</option>
          <option value="CONTRIBUTOR">Contributor</option>
          <option value="ADMIN">Admin</option>
        </select>
      </label>
    </div>
    <div class="invite-actions">
      <button class="btn btn-primary btn-sm" id="mcp-submit" onclick="submitMcpClient()">Generate</button>
      <button class="btn btn-ghost btn-sm" onclick="toggleMcpPanel()">Cancel</button>
    </div>
  </div>

  <!-- MCP clients table -->
  <div class="table-wrap">
    <table id="mcp-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="mcp-tbody">
        <tr><td colspan="4" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

</main>

<!-- ── Confirm modal ─────────────────────────────────────────────────── -->
<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-title">Remove access?</h3>
    <p id="modal-body"></p>
    <div id="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger btn-sm" id="modal-confirm">Remove</button>
    </div>
  </div>
</div>

<!-- ── Token reveal modal ────────────────────────────────────────────── -->
<div id="token-modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; align-items:center; justify-content:center;">
  <div id="token-modal">
    <h3>MCP Client Token</h3>
    <p id="token-modal-name"></p>
    <div id="token-warning">This token is shown only once. Copy it now — it cannot be retrieved again.</div>
    <div id="token-box">
      <span id="token-value"></span>
      <button class="btn btn-ghost btn-sm" onclick="copyToken()">Copy</button>
    </div>
    <div id="modal-actions">
      <button class="btn btn-primary btn-sm" onclick="closeTokenModal()">Done</button>
    </div>
  </div>
</div>
</th:block>

<script layout:fragment="scripts">
// ── State ──────────────────────────────────────────────────────────────
let users = [];

let mcpClients = [];

// ── Init ───────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => { loadUsers(); loadMcpClients(); });

// ── Load users ─────────────────────────────────────────────────────────
async function loadUsers() {
  const tbody = document.getElementById('users-tbody');
  tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-faint)">Loading…</td></tr>';
  try {
    const r = await fetch('/api/admin/users');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    users = await r.json();
    renderTable();
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-faint)">Failed to load users.</td></tr>';
    showError('Could not load users: ' + e.message);
  }
}

function renderTable() {
  const tbody = document.getElementById('users-tbody');
  if (!users.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-faint)">No users found.</td></tr>';
    return;
  }
  tbody.innerHTML = users.map(u => `
    <tr data-user-id="${u.userId}" data-grant-id="${u.grantId}">
      <td>${esc(u.displayName || '—')}</td>
      <td class="pp-slug">${esc(u.email || '—')}</td>
      <td>
        <select class="role-select" onchange="changeRole('${u.userId}','${u.grantId}',this.value)" title="Change role">
          ${['READER','CONTRIBUTOR','ADMIN'].map(r =>
            `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r[0] + r.slice(1).toLowerCase()}</option>`
          ).join('')}
        </select>
      </td>
      <td class="pp-when">${fmtDate(u.createdAt)}</td>
      <td class="pp-when">${fmtDate(u.lastLogin)}</td>
      <td class="pp-actions">
        <div class="action-cell">
          <button class="pp-btn pp-btn-quiet" onclick="confirmRemove('${u.userId}','${u.grantId}','${esc(u.displayName || u.email)}')">Remove</button>
        </div>
      </td>
    </tr>
  `).join('');
}

// ── Role change ────────────────────────────────────────────────────────
async function changeRole(userId, grantId, newRole) {
  hideError();
  try {
    const r = await fetch(`/api/admin/users/${userId}/role`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ grantId, role: newRole })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const u = users.find(u => u.userId === userId);
    if (u) u.role = newRole;
  } catch(e) {
    showError('Failed to change role: ' + e.message);
    loadUsers();
  }
}

// ── Invite ─────────────────────────────────────────────────────────────
function toggleInvite() {
  const panel = document.getElementById('invite-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    document.getElementById('inv-first').focus();
  }
}

async function submitInvite() {
  const firstName = document.getElementById('inv-first').value.trim();
  const lastName  = document.getElementById('inv-last').value.trim();
  const email     = document.getElementById('inv-email').value.trim();
  const role      = document.getElementById('inv-role').value;

  if (!firstName || !lastName || !email) {
    showError('All fields are required.'); return;
  }

  const btn = document.getElementById('inv-submit');
  btn.disabled = true; btn.textContent = 'Sending…';
  hideError();

  try {
    const r = await fetch('/api/admin/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ firstName, lastName, email, role })
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || 'HTTP ' + r.status);
    }
    document.getElementById('inv-first').value = '';
    document.getElementById('inv-last').value  = '';
    document.getElementById('inv-email').value = '';
    document.getElementById('invite-panel').classList.remove('open');
    await loadUsers();
  } catch(e) {
    showError('Invite failed: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Send invite';
  }
}

// ── Remove ─────────────────────────────────────────────────────────────
let pendingRemove = null;

function confirmRemove(userId, grantId, name) {
  pendingRemove = { type: 'user', userId, grantId };
  document.getElementById('modal-body').textContent =
    `Remove access for ${name}? Their Zitadel account will not be deleted.`;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-confirm').onclick = doRemove;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  pendingRemove = null;
}

async function doRemove() {
  if (!pendingRemove) return;
  const { type, userId, grantId } = pendingRemove;
  closeModal();
  hideError();
  try {
    const url = type === 'mcp'
      ? `/api/admin/mcp-clients/${userId}`
      : `/api/admin/users/${userId}?grantId=${encodeURIComponent(grantId)}`;
    const r = await fetch(url, { method: 'DELETE' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (type === 'mcp') { await loadMcpClients(); } else { await loadUsers(); }
  } catch(e) {
    showError('Remove failed: ' + e.message);
  }
}

// ── MCP clients ────────────────────────────────────────────────────────
async function loadMcpClients() {
  const tbody = document.getElementById('mcp-tbody');
  tbody.innerHTML = '<tr><td colspan="4" class="empty">Loading…</td></tr>';
  try {
    const r = await fetch('/api/admin/mcp-clients');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    mcpClients = await r.json();
    renderMcpTable();
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">Failed to load MCP clients.</td></tr>';
    showError('Could not load MCP clients: ' + e.message);
  }
}

function renderMcpTable() {
  const tbody = document.getElementById('mcp-tbody');
  if (!mcpClients.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">No MCP clients found.</td></tr>';
    return;
  }
  tbody.innerHTML = mcpClients.map(c => `
    <tr data-user-id="${c.userId}">
      <td>${esc(c.name || '—')}</td>
      <td><span class="badge badge-${c.role.toLowerCase()}">${c.role}</span></td>
      <td>${fmtDate(c.createdAt)}</td>
      <td>
        <div class="action-cell">
          <button class="btn btn-ghost btn-sm" onclick="confirmRevokeMcp('${c.userId}','${esc(c.name)}')">Revoke</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function confirmRevokeMcp(userId, name) {
  pendingRemove = { type: 'mcp', userId, grantId: null };
  document.getElementById('modal-body').textContent =
    `Revoke token for "${name}"? This deletes the machine user in Zitadel — the token stops working immediately.`;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-confirm').onclick = doRemove;
}

function toggleMcpPanel() {
  const panel = document.getElementById('mcp-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    document.getElementById('mcp-name').focus();
  }
}

async function submitMcpClient() {
  const name = document.getElementById('mcp-name').value.trim();
  const role = document.getElementById('mcp-role').value;

  if (!name) { showError('Name is required.'); return; }

  const btn = document.getElementById('mcp-submit');
  btn.disabled = true; btn.textContent = 'Generating…';
  hideError();

  try {
    const r = await fetch('/api/admin/mcp-clients', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, role })
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || 'HTTP ' + r.status);
    }
    const token = await r.json();
    document.getElementById('mcp-name').value = '';
    document.getElementById('mcp-panel').classList.remove('open');
    await loadMcpClients();
    showTokenModal(name, token.token);
  } catch(e) {
    showError('Token generation failed: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Generate';
  }
}

function showTokenModal(name, token) {
  document.getElementById('token-modal-name').textContent = `Client: ${name}`;
  document.getElementById('token-value').textContent = token;
  document.getElementById('token-modal-overlay').style.display = 'flex';
}

function closeTokenModal() {
  document.getElementById('token-modal-overlay').style.display = 'none';
  document.getElementById('token-value').textContent = '';
}

function copyToken() {
  const text = document.getElementById('token-value').textContent;
  navigator.clipboard?.writeText(text);
}

// ── Helpers ────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }); }
  catch(e) { return '—'; }
}
function showError(msg) {
  const b = document.getElementById('error-banner');
  b.textContent = msg; b.style.display = 'block';
}
function hideError() { document.getElementById('error-banner').style.display = 'none'; }

</script>
</body>
</html>
