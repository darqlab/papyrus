<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/default}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Papyrus — Chat</title>
  <th:block layout:fragment="head">
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    /* ── Main column (chat) ──────────────────────────────────────── */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    /* ── Chat area — 760px measure per design-brief.md §4 ─────────── */
    #chat-wrap { flex: 1; overflow-y: auto; padding: 2.5rem 1.5rem 1.5rem; scroll-behavior: smooth; }
    #messages { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.75rem; padding-bottom: 1rem; }

    /* ── Message bubbles ─────────────────────────────────────────── */
    .msg { display: flex; flex-direction: column; gap: .25rem; width: 100%; }
    .msg.user { align-items: flex-end; padding-left: 15%; }
    .msg.assistant { align-items: flex-start; }

    .bubble { position: relative; word-break: break-word; }

    .msg.user .bubble {
      background: var(--user-bubble-bg);
      color: var(--user-bubble-text);
      border-radius: 12px 12px 3px 12px;
      padding: .75rem 1.1rem;
      max-width: 88%;
      font-size: .95rem;
      line-height: 1.55;
    }

    /* Assistant answers — typeset like a page from the library, the reskin's
       signature element (design-brief.md §9). */
    .msg.assistant .bubble {
      background: var(--assistant-bubble-bg);
      color: var(--assistant-bubble-text);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1.75rem 2rem 1.25rem;
      font-size: 17px;
      line-height: 1.65;
      width: 100%;
    }

    /* Fraunces drop cap on the first paragraph only — never the greeting/empty
       state, which isn't an "answer". */
    .msg.assistant:not(.greeting) .bubble > p:first-of-type::first-letter {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 3.1em;
      float: left;
      line-height: .82;
      padding: 4px 10px 0 0;
      color: var(--accent);
    }

    /* ── Copy button ─────────────────────────────────────────────── */
    .copy-btn {
      position: absolute; top: .45rem; right: .55rem; display: none;
      align-items: center; gap: .25rem; font-size: .72rem;
      color: var(--text-faint); background: var(--code-bg);
      border: 1px solid var(--border); border-radius: 5px;
      padding: .2rem .5rem; cursor: pointer;
      transition: color .15s, background .15s;
    }
    .copy-btn svg { width: 11px; height: 11px; }
    .msg.assistant .bubble:hover .copy-btn { display: inline-flex; }
    .copy-btn:hover { background: var(--border); color: var(--text); }

    /* ── Timestamp ───────────────────────────────────────────────── */
    .msg-time { font-size: .72rem; color: var(--text-faint); padding: 0 .4rem .2rem; }

    /* Markdown styles inside assistant bubble */
    .bubble p  { margin-bottom: .6em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble p + p { margin-top: .2em; }
    .bubble h1,.bubble h2,.bubble h3 { margin: .8em 0 .4em; font-weight: 600; }
    .bubble ul,.bubble ol { padding-left: 1.4em; margin-bottom: .6em; }
    .bubble li { margin-bottom: .25em; }
    .bubble pre {
      background: var(--code-bg); border-radius: 8px; padding: .8rem 1rem;
      overflow-x: auto; font-size: .85rem; margin: .6em 0;
    }
    .bubble code { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: .88em; }
    .bubble p > code { background: var(--code-bg); padding: .1em .4em; border-radius: 4px; }
    .bubble blockquote {
      border-left: 3px solid var(--border); padding-left: .8rem;
      color: var(--text-muted); margin: .5em 0;
    }
    .bubble strong { font-weight: 600; }
    .bubble a { color: var(--accent); text-decoration: underline; }
    .bubble table { border-collapse: collapse; width: 100%; margin: .5em 0; font-size: .9em; }
    .bubble th,.bubble td { border: 1px solid var(--border); padding: .4em .7em; }
    .bubble th { background: var(--table-head); font-weight: 600; }

    /* Inline citation links (linkifySourceCitations) */
    .source-link { color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--border); transition: color .15s, border-color .15s; }
    .source-link:hover { color: var(--accent-hover); border-bottom-color: var(--accent-hover); }

    /* Thinking indicator */
    .thinking { display: flex; align-items: center; gap: 4px; padding: .6rem .8rem; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); animation: bounce .9s infinite; }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

    /* ── Footnotes — citation treatment, the reskin's signature element ──
       Hairline rule + small numbered entries linking to the source. */
    .footnotes { margin-top: 22px; padding-top: 2px; width: 100%; }
    .fn-rule { width: 96px; border: 0; border-top: 1px solid var(--text-faint); margin: 0 0 10px; }
    .footnotes ul { list-style: none; padding: 0; margin: 0; }
    .footnotes li { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 6px; }
    .footnotes a { color: var(--accent); text-decoration: none; }
    .footnotes a:hover { text-decoration: underline; }
    .fn-excerpt { display: block; color: var(--text-faint); }

    /* ── Input bar ───────────────────────────────────────────────── */
    #input-wrap { background: var(--bg); border-top: 1px solid var(--border); padding: 1rem 1rem .75rem; flex-shrink: 0; }
    #input-inner { max-width: 760px; margin: 0 auto; display: flex; gap: .5rem; align-items: flex-end; }
    #msg-input {
      flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
      padding: .7rem 1rem; font-family: inherit; font-size: .95rem; line-height: 1.5;
      max-height: 200px; outline: none; overflow-y: auto;
      background: var(--surface); color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }
    #msg-input::placeholder { color: var(--text-faint); }
    #msg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
    #send-btn {
      width: 44px; height: 44px; border-radius: 10px; border: none;
      background: var(--accent); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: background .15s, transform .1s;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:active:not(:disabled) { transform: scale(.95); }
    #send-btn:disabled { background: var(--text-faint); cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; }

    #input-meta { max-width: 760px; margin: .35rem auto 0; display: flex; justify-content: space-between; align-items: center; }
    .hint { font-size: .78rem; color: var(--text-faint); }
    .hint kbd { font: 11px ui-monospace, "Cascadia Mono", monospace; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; background: var(--surface); color: var(--text-muted); }
    #char-count { font-size: .75rem; color: var(--text-faint); transition: color .15s; }
    #char-count.warn { color: var(--status-warn); }

    /* ── Token usage badge ───────────────────────────────────────── */
    .token-usage { margin-top: .4rem; font-size: .73rem; color: var(--text-faint); display: flex; gap: .5rem; }
    .token-usage span { background: var(--code-bg); border-radius: 4px; padding: .15rem .45rem; }

    /* ── Inline PDF button inside bubble ────────────────────────── */
    .bubble-pdf-btn {
      display: inline-flex; align-items: center; gap: .35rem; margin-top: .85rem;
      font-size: .78rem; color: var(--text-muted); background: var(--code-bg);
      border: 1px solid var(--border); border-radius: 6px; padding: .3rem .7rem;
      cursor: pointer; transition: background .15s, color .15s, border-color .15s;
    }
    .bubble-pdf-btn:hover { background: var(--border); color: var(--text); }
    .bubble-pdf-btn svg { width: 12px; height: 12px; }

    /* ── Credit exhausted / error banners ─────────────────────────── */
    .credit-exhausted-banner {
      display: flex; flex-direction: column; gap: .45rem;
      background: color-mix(in srgb, var(--status-warn) 12%, var(--surface));
      border: 1px solid var(--status-warn); border-radius: 6px;
      padding: .85rem 1.1rem; font-size: .9rem; color: var(--text); max-width: 100%;
    }
    .credit-exhausted-banner strong { color: var(--status-warn); font-size: .95rem; }
    .credit-exhausted-banner a { color: var(--accent); font-weight: 600; text-decoration: underline; }

    .error-banner {
      background: color-mix(in srgb, var(--danger) 10%, var(--surface));
      border-left: 3px solid var(--danger); border-radius: 6px;
      padding: 1rem; margin: .5rem 0; display: flex; flex-direction: column; gap: .5rem;
    }
    .error-banner strong { color: var(--danger); font-size: .95rem; }
    .error-banner a { color: var(--accent); font-weight: 600; text-decoration: underline; }

    /* ── Empty state ───────────────────────────────────────────────
       Corpus count + example questions drawn from real ingested titles
       (design-brief.md §8, §9) — the empty void becomes an invitation. */
    .empty-state { text-align: center; padding: 3rem 1rem .5rem; }
    .empty-state h2 { font-family: "Fraunces", Georgia, serif; font-weight: 560; font-size: 1.625rem; margin-bottom: .5rem; }
    .empty-state p { color: var(--text-muted); }
    .examples { display: flex; flex-wrap: wrap; gap: .625rem; justify-content: center; margin-top: 1.375rem; }
    .examples button {
      font: 14px/1.4 inherit; font-family: inherit; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 999px; padding: .5rem 1rem; cursor: pointer;
      min-height: 44px;
    }
    .examples button:hover { border-color: var(--accent); color: var(--accent); }

  </style>
  </th:block>
</head>
<body>


<!-- ── Chat column ─────────────────────────────────────────────────── -->
<th:block layout:fragment="content">
<div id="chat-wrap">
    <div id="messages"></div>
  </div>

  <div id="input-wrap">
    <div id="input-inner">
      <textarea id="msg-input" rows="1" placeholder="Ask your library…" aria-label="Ask your library"></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M.5 1.163A1 1 0 0 1 1.97.28l12.868 6.837a1 1 0 0 1 0 1.766L1.969 15.72A1 1 0 0 1 .5 14.836V10.33a1 1 0 0 1 .816-.983L8.5 8 1.316 6.653A1 1 0 0 1 .5 5.67V1.163z"/></svg>
      </button>
    </div>
    <div id="input-meta">
      <p class="hint">Press <kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> for new line</p>
      <span id="char-count">0</span>
    </div>
</div>
</th:block>

<script layout:fragment="scripts">
  marked.use({ breaks: true, gfm: true });

  const messagesEl    = document.getElementById('messages');
  const inputEl       = document.getElementById('msg-input');
  const sendBtn       = document.getElementById('send-btn');
  const chatWrap      = document.getElementById('chat-wrap');
  const charCount     = document.getElementById('char-count');

  let GREETING = '';
  const history = [];
  let streaming = false;

  const PDF_KEYWORDS = /\b(pdf|print|printable|download|export)\b/i;
  function wantsPdf(text) { return PDF_KEYWORDS.test(text); }

  // ── Empty state: corpus count + example questions from real titles ──
  // Note: GET /api/documents?limit=500 undercounts past 500 docs — there is no
  // dedicated corpus-count endpoint. Acceptable for now; flagged as a backend TODO.
  function titleFromDoc(d) {
    if (d.archiveFilename) {
      const m = d.archiveFilename.match(/^(\d{4}-\d{2}-\d{2})-(.+?)(-p\d+)?$/);
      if (m) return m[2].replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      return d.archiveFilename.replace(/\.[^.]+$/, '');
    }
    return d.filename.replace(/\.[^.]+$/, '');
  }

  function exampleQuestions(titles) {
    const templates = [
      t => `What does ${t} say?`,
      t => `Summarise ${t}.`,
      t => `What can I learn from ${t}?`
    ];
    return titles.slice(0, 3).map((t, i) => templates[i % templates.length](t));
  }

  async function initEmptyState() {
    let count = 0;
    let examples = [
      'What does the employee handbook say about annual leave?',
      'Summarise the most recently ingested document.',
      'What documents are in the library?'
    ];
    try {
      const res = await fetch('/api/documents?limit=500');
      if (res.ok) {
        const docs = await res.json();
        count = docs.length;
        const titles = docs.filter(d => d.status === 'DONE').map(titleFromDoc);
        if (titles.length >= 3) examples = exampleQuestions(titles);
      }
    } catch (_) { /* offline — fall back to generic copy below */ }

    const countLine = count > 0
      ? `Your library holds ${count} document${count === 1 ? '' : 's'}.`
      : 'Your library is ready.';

    messagesEl.innerHTML = `
      <div class="msg assistant greeting">
        <div class="empty-state">
          <h2>${esc(countLine)}</h2>
          <p>Ask about any of them — answers cite their sources.</p>
          <div class="examples">
            ${examples.map(q => `<button type="button" onclick="askExample(this)">${esc(q)}</button>`).join('')}
          </div>
        </div>
      </div>`;
    GREETING = messagesEl.innerHTML;
  }

  function askExample(btn) {
    inputEl.value = btn.textContent;
    sendMessage();
  }

  // ── New Conversation ─────────────────────────────────────────────
  function newConversation() {
    if (history.length === 0) return;
    if (!confirm('Start a new conversation? The current chat will be cleared.')) return;
    messagesEl.innerHTML = GREETING;
    history.length = 0;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    charCount.textContent = '0';
    charCount.classList.remove('warn');
    inputEl.focus();
  }

  // ── Character counter ────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
    const len = inputEl.value.length;
    charCount.textContent = len;
    charCount.classList.toggle('warn', len > 2000);
  });

  // ── Enter to send ────────────────────────────────────────────────
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!streaming) sendMessage();
    }
  });

  // ── Scroll to bottom ─────────────────────────────────────────────
  function scrollBottom() { chatWrap.scrollTop = chatWrap.scrollHeight; }

  // ── Timestamp ────────────────────────────────────────────────────
  function makeTimestamp() {
    const span = document.createElement('span');
    span.className = 'msg-time';
    span.textContent = new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    return span;
  }

  // ── Copy button ──────────────────────────────────────────────────
  function makeCopyBtn(getRawText) {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.innerHTML = `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg> Copy`;
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(getRawText()).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => {
          btn.innerHTML = `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg> Copy`;
        }, 1500);
      }).catch(() => {});
    });
    return btn;
  }

  // ── Append a user bubble ─────────────────────────────────────────
  function appendUser(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    div.appendChild(makeTimestamp());
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollBottom();
  }

  // ── Append a (streaming) assistant bubble ────────────────────────
  function appendAssistant() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = `<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollBottom();
    return { bubble, msgEl: div };
  }

  // ── PDF export ───────────────────────────────────────────────────
  const PDF_ICON = `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z"/><path d="M4.603 14.087a.81.81 0 0 1-.438-.42c-.195-.388-.13-.776.08-1.102.198-.307.526-.568.897-.787a7.68 7.68 0 0 1 1.482-.645 19.697 19.697 0 0 0 1.062-2.227 7.269 7.269 0 0 1-.43-1.295c-.086-.4-.119-.796-.046-1.136.075-.354.274-.672.65-.823.192-.077.4-.12.602-.077a.7.7 0 0 1 .477.365c.088.164.12.356.127.538.007.188-.012.396-.047.614-.084.51-.27 1.134-.52 1.794a10.954 10.954 0 0 0 .98 1.686 5.753 5.753 0 0 1 1.334.05c.364.065.734.195.96.465.12.144.193.32.2.518.007.192-.047.382-.138.563a1.04 1.04 0 0 1-.354.416.856.856 0 0 1-.51.138c-.331-.014-.654-.196-.933-.417a5.712 5.712 0 0 1-.911-.95 11.651 11.651 0 0 0-1.997.406 11.307 11.307 0 0 1-1.02 1.51c-.292.35-.609.656-.927.787a.793.793 0 0 1-.58.029z"/></svg>`;

  function addPdfButton(bubble) {
    const btn = document.createElement('button');
    btn.className = 'bubble-pdf-btn';
    btn.innerHTML = PDF_ICON + ' Download PDF';
    btn.addEventListener('click', () => printBubble(bubble));
    bubble.appendChild(btn);
  }

  function printBubble(bubble) {
    const clone = bubble.cloneNode(true);
    clone.querySelectorAll('.bubble-pdf-btn, .copy-btn').forEach(el => el.remove());
    const content = clone.innerHTML;
    const now = new Date();
    const dateStr = now.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    const win = window.open('', '_blank', 'width=860,height=700');
    win.document.write(`<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Papyrus Export ${now.toISOString().slice(0,10)}</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@page{size:A4;margin:2.2cm 2.5cm 2.8cm;@bottom-right{content:"Page " counter(page) " of " counter(pages);font-size:8pt;color:#9ca3af}}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:10.5pt;line-height:1.7;color:#111827;background:#fff}
header{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:.75rem;margin-bottom:1.5rem;border-bottom:2px solid #241F19}
header .brand{font-size:16pt;font-weight:700;letter-spacing:.04em;color:#241F19}
header .meta{font-size:8.5pt;color:#6b7280;text-align:right;line-height:1.5}
.content p{margin-bottom:.65em}.content p:last-child{margin-bottom:0}
.content h1{font-size:14pt;font-weight:700;margin:1em 0 .4em}
.content h2{font-size:12pt;font-weight:700;margin:.9em 0 .4em}
.content h3{font-size:11pt;font-weight:600;margin:.8em 0 .35em}
.content ul,.content ol{padding-left:1.5em;margin-bottom:.65em}.content li{margin-bottom:.3em}
.content strong{font-weight:700}.content em{font-style:italic}
.content blockquote{border-left:3px solid #d1d5db;padding:.4em .9em;color:#4b5563;margin:.75em 0;background:#f9fafb;border-radius:0 4px 4px 0}
.content pre{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:6px;padding:.85rem 1rem;font-size:9pt;margin:.75em 0;page-break-inside:avoid}
.content code{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:.9em}
.content p>code{background:#f3f4f6;border:1px solid #e5e7eb;padding:.1em .4em;border-radius:3px;font-size:.88em}
.content table{border-collapse:collapse;width:100%;margin:.75em 0;font-size:9.5pt;page-break-inside:avoid}
.content th,.content td{border:1px solid #d1d5db;padding:.4em .75em;text-align:left}
.content th{background:#f3f4f6;font-weight:700;color:#1f2937}
.content tr:nth-child(even) td{background:#f9fafb}
footer{margin-top:2.5rem;padding-top:.6rem;border-top:1px solid #e5e7eb;font-size:8pt;color:#9ca3af}
</style></head><body>
<header><div class="brand">Papyrus</div><div class="meta">Exported on ${dateStr}<br>at ${timeStr}</div></header>
<div class="content">${content}</div>
<footer>Generated by Papyrus Document Intelligence</footer>

  // ── Stream /api/chat ─────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || streaming) return;

    streaming = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    charCount.textContent = '0';
    charCount.classList.remove('warn');

    const needsPdf = wantsPdf(text);

    appendUser(text);
    history.push({ role: 'user', content: text });

    const { bubble, msgEl } = appendAssistant();
    let accumulated = '';
    let sourcesData = [];
    let usageData   = null;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      if (!res.ok) {
        let errorMsg = `Error ${res.status}`;
        try {
          const errorData = await res.json();
          if (errorData.error?.message) {
            errorMsg = errorData.error.message;
          } else if (typeof errorData === 'string') {
            errorMsg = errorData;
          }
        } catch (_) {}

        const banner = document.createElement('div');
        banner.className = 'error-banner';
        banner.innerHTML = `<strong>&#9888; ${esc(errorMsg)}</strong>`;
        if (errorMsg.includes('API usage') || errorMsg.includes('limit')) {
          banner.innerHTML += `<span>Check your API account at <a href="https://console.anthropic.com/settings/billing" target="_blank" rel="noopener">console.anthropic.com</a></span>`;
        }
        bubble.appendChild(banner);
        history.pop(); return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer    = '';
      let done_flag = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();

        for (const part of parts) {
          const lines = part.split('\n');
          let evtName = '';
          const dataLines = [];
          for (const line of lines) {
            if (line.startsWith('event:')) evtName = line.slice(6).trim();
            else if (line.startsWith('data:')) dataLines.push(line.slice(5));
          }
          const rawData = dataLines.join('\n');
          if (evtName === 'done') {
            done_flag = true;
          } else if (evtName === 'sources') {
            try { sourcesData = JSON.parse(rawData); } catch (_) {}
          } else if (evtName === 'usage') {
            try { usageData = JSON.parse(rawData); } catch (_) {}
          } else if (evtName === 'error') {
            bubble.innerHTML = `<span style="color:var(--danger)">Error: ${esc(JSON.parse(rawData))}</span>`;
            history.pop(); return;
          } else if (evtName === 'credit_exhausted') {
            bubble.innerHTML = '';
            const banner = document.createElement('div');
            banner.className = 'credit-exhausted-banner';
            banner.innerHTML = `<strong>&#9888; AI provider credit balance exhausted</strong>`
              + `<span>This Papyrus instance has run out of API credits and cannot generate a response.</span>`
              + `<span>Top up your balance with your AI provider, then restart the service.</span>`;
            bubble.appendChild(banner);
            history.pop(); return;
          } else if (rawData) {
            try {
              accumulated += JSON.parse(rawData);
              bubble.innerHTML = marked.parse(accumulated);
              scrollBottom();
            } catch (_) {}
          }
        }
        if (done_flag) break;
      }

      bubble.innerHTML = marked.parse(accumulated);
      // Linkify any inline source citations in the rendered text
      if (sourcesData.length > 0) linkifySourceCitations(bubble, sourcesData);
      // Add copy button and optional PDF button after streaming
      const copyBtn = makeCopyBtn(() => accumulated);
      bubble.appendChild(copyBtn);
      if (needsPdf) addPdfButton(bubble);
      // Inject token usage badge
      if (usageData) injectUsage(bubble, usageData);
      // Inject sources as footnotes (the reskin's signature citation treatment)
      if (sourcesData.length > 0) injectSources(bubble, sourcesData);
      // Add timestamp above the bubble
      msgEl.insertBefore(makeTimestamp(), bubble);
      scrollBottom();
      history.push({ role: 'assistant', content: accumulated });

    } catch (err) {
      bubble.innerHTML = `<span style="color:var(--danger)">Network error: ${esc(err.message)}</span>`;
      history.pop();
    } finally {
      streaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ── Linkify inline source citations in rendered markdown ─────────
  function linkifySourceCitations(bubble, sources) {
    const fileMap = new Map();
    sources.forEach(s => {
      if (s.sourceId && s.archiveFilename) {
        const url = `/api/documents/${s.sourceId}/file`;
        fileMap.set(s.archiveFilename, url);
      }
    });
    if (fileMap.size === 0) return;

    const escaped = [...fileMap.keys()].map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const pattern = new RegExp('(' + escaped.join('|') + ')', 'g');

    const walker = document.createTreeWalker(bubble, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) textNodes.push(node);

    textNodes.forEach(textNode => {
      if (!pattern.test(textNode.nodeValue)) return;
      pattern.lastIndex = 0;

      const parent = textNode.parentNode;
      const frag = document.createDocumentFragment();
      let last = 0;
      let m;
      while ((m = pattern.exec(textNode.nodeValue)) !== null) {
        if (m.index > last) {
          frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last, m.index)));
        }
        const a = document.createElement('a');
        a.href = fileMap.get(m[1]);
        a.target = '_blank';
        a.rel = 'noopener';
        a.className = 'source-link';
        a.textContent = m[1];
        frag.appendChild(a);
        last = m.index + m[1].length;
      }
      if (last < textNode.nodeValue.length) {
        frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last)));
      }
      parent.replaceChild(frag, textNode);
    });
  }

  // ── Token usage badge ────────────────────────────────────────────
  function injectUsage(bubble, usage) {
    const div = document.createElement('div');
    div.className = 'token-usage';
    div.innerHTML = `<span>&#8593; ${usage.inputTokens.toLocaleString()} in</span>`
                  + `<span>&#8595; ${usage.outputTokens.toLocaleString()} out</span>`;
    bubble.appendChild(div);
  }

  // ── Footnotes — hairline rule + small numbered entries ───────────
  // Replaces the previous collapsible "Sources" panel; same underlying data
  // (backend event contract unchanged) restyled per design-brief.md §9.
  function injectSources(bubble, sources) {
    const div = document.createElement('div');
    div.className = 'footnotes';
    const hr = document.createElement('hr');
    hr.className = 'fn-rule';
    div.appendChild(hr);
    const ul = document.createElement('ul');
    sources.forEach((s, i) => {
      const li = document.createElement('li');
      const label = formatSourceLabel(s.filename);
      const hasImage = s.sourceId && s.archiveFilename;
      const imageUrl = hasImage ? `/api/documents/${s.sourceId}/file` : null;
      const titleEl = hasImage
        ? `<a href="${imageUrl}" target="_blank" rel="noopener">${esc(label)}</a>`
        : `<span>${esc(label)}</span>`;
      li.innerHTML = `${i + 1}&nbsp;&nbsp;${titleEl}`
        + (s.excerpt ? `<span class="fn-excerpt">${esc(s.excerpt)}</span>` : '');
      ul.appendChild(li);
    });
    div.appendChild(ul);
    bubble.appendChild(div);
  }

  // ── Source label formatter ───────────────────────────────────────
  function formatSourceLabel(filename) {
    if (!filename) return filename;
    const dateMatch = filename.match(/^(\d{4}-\d{2}-\d{2})-(.+?)(-p\d+)?$/);
    if (!dateMatch) return filename;
    const date = dateMatch[1];
    const slug = dateMatch[2].replace(/-/g, ' ');
    const page = dateMatch[3] ? dateMatch[3].replace('-p', 'p.') : null;
    const formatted = new Date(date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    return page ? `${slug} — ${formatted}, ${page}` : `${slug} — ${formatted}`;
  }


  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.addEventListener('DOMContentLoaded', () => { initEmptyState(); inputEl.focus(); });
</script>
