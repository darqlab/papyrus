spring:
  application:
    name: papyrus-mcp

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/papyrus}
    username: ${DB_USER:papyrus}
    password: ${DB_PASSWORD:papyrus}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    mcp:
      server:
        name: papyrus
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE

server:
  port: ${SERVER_PORT:8080}

papyrus:
  embedding:
    provider: ${EMBEDDING_PROVIDER:voyage}
    voyage:
      api-key: ${VOYAGE_API_KEY:}
      model: ${VOYAGE_MODEL:voyage-3-lite}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:nomic-embed-text}
  ocr:
    correction:
      enabled: ${OCR_CORRECTION_ENABLED:false}
      provider: ${OCR_PROVIDER:anthropic}
      model: ${OCR_CORRECTION_MODEL:claude-sonnet-4-6}
      anthropic:
        api-key: ${ANTHROPIC_API_KEY:}
      ollama:
        base-url: ${OCR_OLLAMA_BASE_URL:http://localhost:11434}
      evolink:
        api-key: ${EVOLINK_API_KEY:}
  chat:
    provider: ${CHAT_PROVIDER:anthropic}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CHAT_MODEL:claude-opus-4-6}
    ollama:
      base-url: ${CHAT_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${CHAT_OLLAMA_MODEL:llama3.2}
    evolink:
      api-key: ${EVOLINK_API_KEY:}
      base-url: ${EVOLINK_BASE_URL:https://direct.evolink.ai}
      model: ${CHAT_EVOLINK_MODEL:evolink/auto}
  archive:
    enabled: ${ARCHIVE_ENABLED:false}
    path: ${ARCHIVE_PATH:/data/papyrus/archive}
    abbreviations:
      "[minutes of the meeting of]": ""
      "[executive committee]": execomm
      "[western mindanao mission]": wmm
  chunking:
    strategy: ${CHUNKING_STRATEGY:PARAGRAPH}
    max-tokens: ${CHUNKING_MAX_TOKENS:512}
    overlap-tokens: ${CHUNKING_OVERLAP_TOKENS:64}
  search:
    default-top-k: ${SEARCH_TOP_K:5}
  mcp:
    base-url: ${MCP_BASE_URL:https://mcp-papyrus.darqlab.net}
    public-url: ${MCP_PUBLIC_URL:https://mcp-papyrus.darqlab.net/mcp}
