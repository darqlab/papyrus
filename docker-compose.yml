# Local development compose — builds images from source, no registry push needed.
# Requires the standalone DB to be running first:
#   docker compose -f docker-compose.db.yml up -d
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml up -d --build papyrus-api   # rebuild one service
#   docker compose -f docker-compose.local.yml down
#
# c-ingestor (on-demand embedding-model reingest, ADR-009) is off by default — it only
# starts when the "reingest" profile is explicitly requested, and runs once to completion:
#   TARGET_MODEL=voyage-3-lite docker compose --profile reingest up --build papyrus-ingestor
#   docker compose --profile reingest run --rm papyrus-ingestor   # alternative, auto-removes on exit

services:

  papyrus-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: papyrus-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      DATABASE_URL:           jdbc:postgresql://papyrus-pgvector:5432/${POSTGRES_DB:-papyrus}
      DATABASE_USER:          ${POSTGRES_USER:-papyrus}
      DATABASE_PASSWORD:      ${POSTGRES_PASSWORD:-papyrus}
      VOYAGE_API_KEY:         ${VOYAGE_API_KEY}
      VOYAGE_MODEL:           ${VOYAGE_MODEL:-voyage-3-lite}
      ANTHROPIC_API_KEY:      ${ANTHROPIC_API_KEY:-}
      OCR_CORRECTION_ENABLED: ${OCR_CORRECTION_ENABLED:-false}
      OCR_CORRECTION_MODEL:   ${OCR_CORRECTION_MODEL:-claude-sonnet-4-6}
      ARCHIVE_ENABLED:        ${ARCHIVE_ENABLED:-false}
      ARCHIVE_PATH:           /data/papyrus/archive
      CHAT_PROVIDER:          ${CHAT_PROVIDER:-anthropic}
      CHAT_MODEL:             ${CHAT_MODEL:-claude-opus-4-6}
      # Uncomment to load prompts from host files instead of classpath defaults:
      # CHAT_PROMPT_FILE:     /etc/papyrus/prompts/chat-system.md
      # OCR_PROMPT_FILE:      /etc/papyrus/prompts/ocr-correction.md
      TZ: Asia/Manila
    volumes:
      - ./volumes/archive:/data/papyrus/archive
      # Uncomment to mount custom prompt files (requires CHAT_PROMPT_FILE / OCR_PROMPT_FILE above):
      # - ./volumes/prompts:/etc/papyrus/prompts:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - papyrus-db

  papyrus-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: papyrus-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8082}:8080"
    environment:
      DATABASE_URL:    jdbc:postgresql://papyrus-pgvector:5432/${POSTGRES_DB:-papyrus}
      DB_USER:         ${POSTGRES_USER:-papyrus}
      DB_PASSWORD:     ${POSTGRES_PASSWORD:-papyrus}
      VOYAGE_API_KEY:  ${VOYAGE_API_KEY}
      VOYAGE_MODEL:    ${VOYAGE_MODEL:-voyage-3-lite}
      CHAT_MODEL:      ${CHAT_MODEL:-claude-opus-4-6}
      ARCHIVE_ENABLED: ${ARCHIVE_ENABLED:-false}
      ARCHIVE_PATH:    /data/papyrus/archive
      TZ: Asia/Manila
    volumes:
      - ./volumes/archive:/data/papyrus/archive
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - papyrus-db

  papyrus-ingestor:
    profiles: ["reingest"]
    build:
      context: .
      dockerfile: Dockerfile.ingestor
    container_name: papyrus-ingestor
    restart: "no"
    environment:
      TARGET_MODEL:               ${TARGET_MODEL:-voyage-3-lite}
      INGESTOR_DB_HOST:           papyrus-pgvector
      INGESTOR_DB_PORT:           5432
      INGESTOR_DB_ADMIN_DATABASE: ${INGESTOR_DB_ADMIN_DATABASE:-postgres}
      INGESTOR_DB_ADMIN_USER:     ${POSTGRES_USER:-papyrus}
      INGESTOR_DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-papyrus}
      INGESTOR_SOURCE_DATABASE:   ${POSTGRES_DB:-papyrus}
      ARCHIVE_PATH:               /data/papyrus/archive
      VOYAGE_API_KEY:             ${VOYAGE_API_KEY}
      VOYAGE_MODEL:               ${VOYAGE_MODEL:-voyage-3-lite}
      TZ: Asia/Manila
    volumes:
      - ./volumes/archive:/data/papyrus/archive:ro
    networks:
      - papyrus-db

networks:
  papyrus-db:
    external: true
