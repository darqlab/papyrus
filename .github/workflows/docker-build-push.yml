name: Docker Build and Push

on:
  push:
    branches:
      - staging
      - master
  pull_request:
    branches:
      - staging
      - master

env:
  API_IMAGE: dennisarq/papyrus-api
  MCP_IMAGE: dennisarq/papyrus-mcp
  INGESTOR_IMAGE: dennisarq/papyrus-ingestor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JARs with Maven
        run: mvn -pl papyrus-core,papyrus-extractor,papyrus-pipeline,papyrus-api,papyrus-mcp,papyrus-ingestor install -DskipTests -q

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (for arm64 cross-build)
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # ── API image ──────────────────────────────────────────────────────

      - name: Build and push API :staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.API_IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API :latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── MCP image ──────────────────────────────────────────────────────

      - name: Build and push MCP :staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MCP_IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MCP :latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MCP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Ingestor image (batch reingest tool, ADR-009) ───────────────────

      - name: Build and push Ingestor :staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ingestor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.INGESTOR_IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Ingestor :latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ingestor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.INGESTOR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
