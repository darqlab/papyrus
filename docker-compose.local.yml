# Local development compose — builds images from source, no registry push needed.
#
# Prerequisites:
#   mvn -pl papyrus-core,papyrus-extractor,papyrus-pipeline,papyrus-api,papyrus-mcp install -DskipTests
#
# Usage:
#   docker compose -f docker-compose.local.yml up --build
#   docker compose -f docker-compose.local.yml down

services:

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: papyrus-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-papyrus}
      POSTGRES_USER:     ${POSTGRES_USER:-papyrus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papyrus}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papyrus} -d ${POSTGRES_DB:-papyrus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - local

  papyrus-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: papyrus-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      DATABASE_URL:           jdbc:postgresql://pgvector:5432/${POSTGRES_DB:-papyrus}
      DATABASE_USER:          ${POSTGRES_USER:-papyrus}
      DATABASE_PASSWORD:      ${POSTGRES_PASSWORD:-papyrus}
      VOYAGE_API_KEY:         ${VOYAGE_API_KEY}
      ANTHROPIC_API_KEY:      ${ANTHROPIC_API_KEY:-}
      OCR_CORRECTION_ENABLED: ${OCR_CORRECTION_ENABLED:-false}
      ARCHIVE_ENABLED:        ${ARCHIVE_ENABLED:-false}
      ARCHIVE_PATH:           /data/papyrus/archive
      TZ: Asia/Manila
    volumes:
      - papyrus_archive:/data/papyrus/archive
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - local

  papyrus-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: papyrus-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8082}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://pgvector:5432/${POSTGRES_DB:-papyrus}
      DB_USER:      ${POSTGRES_USER:-papyrus}
      DB_PASSWORD:  ${POSTGRES_PASSWORD:-papyrus}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      ARCHIVE_ENABLED: ${ARCHIVE_ENABLED:-false}
      ARCHIVE_PATH:    /data/papyrus/archive
      TZ: Asia/Manila
    volumes:
      - papyrus_archive:/data/papyrus/archive
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - local

volumes:
  pgvector_data_local:
  papyrus_archive:

networks:
  local:
